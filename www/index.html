/* ===== 02-themes.js ===== */
{
/* ==========================================================================
   RE:SET — 02-themes.js
   Centralised design tokens. Every colour in the UI comes from CSS custom
   properties produced here, for built-in themes and the custom builder alike.
   Text colours are checked against their backgrounds (WCAG contrast) and
   nudged automatically if a chosen combination would be hard to read.
   ========================================================================== */

Themes = RS.Themes = {};

/* ---- colour maths ------------------------------------------------------- */
const hex2rgb = h => {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
};
const rgb2hex = a => '#' + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('');
const mix = (a, b, t) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => v + (B[i] - v) * t)); };
const lum = h => {
  const c = hex2rgb(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
};
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const minContrast = (fg, bgs) => Math.min.apply(null, bgs.map(b => contrast(fg, b)));
/* Smallest shift of `fg` (toward black or white) that reaches `min` contrast on all `bgs`. */
const ensure = (fg, bgs, min) => {
  bgs = [].concat(bgs);
  if (minContrast(fg, bgs) >= min) return fg;
  /* move toward whichever pole (black/white) contrasts more with the backgrounds */
  const w = minContrast('#ffffff', bgs), k = minContrast('#000000', bgs);
  const target = w >= k ? '#ffffff' : '#000000';
  if (Math.max(w, k) < min) return target;
  let lo = 0, hi = 1;
  for (let i = 0; i < 16; i++) { const m = (lo + hi) / 2; if (minContrast(mix(fg, target, m), bgs) >= min) hi = m; else lo = m; }
  return mix(fg, target, hi);
};
const ink = bg => contrast(bg, '#14130F') >= contrast(bg, '#FFFFFF') ? '#14130F' : '#FFFFFF';
const validHex = s => typeof s === 'string' && /^#[0-9a-fA-F]{6}$/.test(s);
Themes.color = { hex2rgb, rgb2hex, mix, lum, contrast, ensure, ink, validHex };

/* ---- built-in themes ---------------------------------------------------- */
Themes.BUILTIN = [
  { id: 'obsidian', name: 'Obsidian', desc: 'Deep charcoal, soft white, brass accent', display: 'sans',
    bg: '#111214', surface: '#1A1B1E', text: '#ECEAE4', accent: '#C9AE7C', accent2: '#8E98AB' },
  { id: 'midnight', name: 'Midnight', desc: 'Dark navy with calm blue accents', display: 'sans',
    bg: '#0B1220', surface: '#131C30', text: '#E6EBF5', accent: '#7FA6F0', accent2: '#8E8BEA' },
  { id: 'sage', name: 'Sage', desc: 'Soft sage green on warm neutrals', display: 'sans',
    bg: '#EDEFE6', surface: '#F7F8F1', text: '#232A21', accent: '#5C7C58', accent2: '#A18B5C' },
  { id: 'paper', name: 'Paper', desc: 'Off-white, dark ink, notebook feel', display: 'serif',
    bg: '#F5F2EA', surface: '#FBF9F4', text: '#1E1C19', accent: '#33405E', accent2: '#8A5B3A' },
  { id: 'lavender', name: 'Lavender', desc: 'Muted lavender on soft neutrals', display: 'sans',
    bg: '#F1EFF6', surface: '#FAF9FC', text: '#25222E', accent: '#7A68B0', accent2: '#A97E9E' },
  { id: 'solar', name: 'Solar', desc: 'Warm cream, amber, deep brown', display: 'serif',
    bg: '#F7EFD9', surface: '#FFF9E9', text: '#3B2B1D', accent: '#C27A10', accent2: '#8C5C2E' }
];
Themes.byId = id => Themes.BUILTIN.find(t => t.id === id) || null;

Themes.DEFAULT_CUSTOM = { bg: '#14161A', surface: '#1D2025', accent: '#8FB8A8', accent2: '#C9A66B', base: 'dark', contrast: 'normal' };

/* Curated palettes for the custom builder (pairs set background + surface together). */
Themes.PALETTE = {
  backgrounds: {
    dark: [['#0E0F11', '#17191D'], ['#111418', '#1B2027'], ['#0B1220', '#131C30'], ['#14161A', '#1D2025'], ['#1A1613', '#251F1A'], ['#10171A', '#18222A']],
    light: [['#F6F3EC', '#FCFAF6'], ['#F2F0F7', '#FAF9FD'], ['#EEF0E8', '#F8F9F3'], ['#F8F0DC', '#FFF9EA'], ['#F4F4F2', '#FFFFFF'], ['#EEF3F6', '#F9FBFC']]
  },
  accents: ['#C9AE7C', '#8FB8A8', '#7FA6F0', '#8E8BEA', '#B79AD6', '#D98A94', '#E0A04A', '#5C7C58', '#33405E', '#7A68B0', '#C27A10', '#8A5B3A']
};

/* ---- token derivation --------------------------------------------------- */
/* spec: { bg, surface, text?, accent, accent2, contrast?: 'low'|'normal'|'high' } */
Themes.derive = spec => {
  const bg = spec.bg;
  const dark = lum(bg) < 0.3;
  const pole = dark ? '#FFFFFF' : '#000000';
  /* If the chosen surface and background are so far apart that no single text colour
     can be read on both (e.g. mid-grey background + near-black surface), derive the
     surface from the background instead so text always stays readable. */
  let surface = spec.surface;
  const readable = sf => { const bs = [bg, sf, mix(sf, pole, dark ? 0.06 : 0.045)]; return Math.max(minContrast('#ffffff', bs), minContrast('#000000', bs)) >= 4.5; };
  if (!readable(surface)) {
    const textPole = contrast('#ffffff', bg) >= contrast('#000000', bg) ? '#ffffff' : '#000000';
    surface = mix(bg, textPole === '#ffffff' ? '#000000' : '#ffffff', 0.06);
  }
  const textBase = spec.text || (dark ? '#F1EFE9' : '#1B1A17');
  const surface2 = mix(surface, pole, dark ? 0.06 : 0.045);
  const bgs = [bg, surface, surface2];

  let text = textBase;
  if (spec.contrast === 'high') text = mix(textBase, pole, 0.7);
  if (spec.contrast === 'low') text = mix(textBase, bg, 0.2);
  text = ensure(text, bgs, spec.contrast === 'low' ? 4.5 : 7);
  const text2 = ensure(mix(text, bg, 0.34), bgs, 4.5);
  const text3 = ensure(mix(text, bg, 0.52), bgs, 4.5);

  const accent = ensure(spec.accent, [bg, surface], 3);
  const accentText = ensure(spec.accent, bgs, 4.5);
  const accent2 = ensure(spec.accent2 || spec.accent, [bg, surface], 3);
  const accent2Text = ensure(spec.accent2 || spec.accent, bgs, 4.5);
  const over = ensure(dark ? '#E39A52' : '#B4561B', [bg, surface], 3);
  const overText = ensure(dark ? '#E39A52' : '#B4561B', bgs, 4.5);
  const danger = ensure(dark ? '#E87D73' : '#B3372E', [bg, surface], 3);
  const dangerText = ensure(dark ? '#E87D73' : '#B3372E', bgs, 4.5);

  const vars = {
    '--bg': bg, '--surface': surface, '--surface-2': surface2,
    '--border': mix(surface, pole, dark ? 0.14 : 0.12),
    '--border-strong': mix(surface, pole, dark ? 0.26 : 0.24),
    '--text': text, '--text-2': text2, '--text-3': text3,
    '--accent': accent, '--accent-text': accentText, '--accent-ink': ink(accent),
    '--accent-soft': mix(surface, accent, dark ? 0.2 : 0.16),
    '--accent-2': accent2, '--accent-2-text': accent2Text,
    '--accent-2-soft': mix(surface, accent2, dark ? 0.2 : 0.16),
    '--over': over, '--over-text': overText, '--over-soft': mix(surface, over, 0.16),
    '--danger': danger, '--danger-text': dangerText, '--danger-ink': ink(danger),
    '--overlay': dark ? 'rgba(0,0,0,.62)' : 'rgba(20,18,14,.42)',
    '--shadow': dark ? '0 10px 30px rgba(0,0,0,.5)' : '0 10px 30px rgba(40,30,10,.14)'
  };
  return { vars, dark, bg, surface };
};

/* Resolve which spec is active from settings (supports "follow device" mode). */
Themes.specFor = (id, custom) => {
  if (id === 'custom') {
    const c = Object.assign({}, Themes.DEFAULT_CUSTOM, custom || {});
    ['bg', 'surface', 'accent', 'accent2'].forEach(k => { if (!validHex(c[k])) c[k] = Themes.DEFAULT_CUSTOM[k]; });
    return Object.assign({ id: 'custom', name: 'Custom', display: 'sans' }, c);
  }
  return Themes.byId(id) || Themes.byId('obsidian');
};
Themes.activeSpec = () => {
  const st = RS.Store.state, th = st.theme;
  let id = th.id;
  if (th.mode === 'device') {
    const dark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches;
    id = dark ? th.darkId : th.lightId;
  }
  return Themes.specFor(id, th.custom);
};

/* ---- layout tokens (density / radius / font) ---------------------------- */
const RADII = { sharp: [4, 6, 10], soft: [8, 14, 20], round: [12, 20, 28] };
const FONTS = {
  sans: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif',
  serif: 'ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", "Times New Roman", serif',
  mono: 'ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace'
};
Themes.layoutVars = (settings, spec) => {
  const r = RADII[settings.radius] || RADII.soft;
  const displayKey = settings.font === 'theme' ? (spec.display || 'sans') : settings.font;
  const bodyKey = settings.font === 'mono' ? 'mono' : 'sans';
  return {
    '--r-sm': r[0] + 'px', '--r-md': r[1] + 'px', '--r-lg': r[2] + 'px',
    '--dens': settings.density === 'compact' ? '0.8' : '1',
    '--font-body': FONTS[bodyKey], '--font-display': FONTS[displayKey]
  };
};

/* ---- habit accent colours ------------------------------------------------ */
Themes.HABIT_COLORS = { theme: null, slate: '#8A94A6', sand: '#C2A878', sage: '#7FA37A', sky: '#6FA3D8', rose: '#D98A94', plum: '#A682C2', amber: '#D9A13E', teal: '#5FB3A8' };
Themes.cur = null;
Themes.habitColor = key => {
  const t = Themes.cur; if (!t) return '#888888';
  const base = Themes.HABIT_COLORS[key];
  return base ? ensure(base, [t.surface, t.bg], 3) : t.vars['--accent'];
};
Themes.habitTint = key => mix(Themes.cur.surface, Themes.habitColor(key), Themes.cur.dark ? 0.2 : 0.15);

/* ---- applying ----------------------------------------------------------- */
Themes.apply = () => {
  const st = RS.Store.state;
  const spec = Themes.activeSpec();
  const d = Themes.derive(spec);
  Themes.cur = d;
  if (typeof document === 'undefined') return d;
  const root = document.documentElement;
  const all = Object.assign({}, d.vars, Themes.layoutVars(st.settings, spec));
  Object.keys(all).forEach(k => root.style.setProperty(k, all[k]));
  root.dataset.theme = spec.id;
  root.style.colorScheme = d.dark ? 'dark' : 'light';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', d.bg);
  /* tiny cache so the next launch paints the right background immediately */
  try { localStorage.setItem('reset.boot', JSON.stringify({ bg: d.bg, dark: d.dark })); } catch (e) { /* non-critical */ }
  return d;
};

/* Scoped variables for live previews (applied to one element, not the page). */
Themes.previewStyle = (spec, settings) => {
  const d = Themes.derive(spec);
  const all = Object.assign({}, d.vars, Themes.layoutVars(settings, spec));
  return all;
};

}

/* ===== 03-store.js ===== */
{
/* ==========================================================================
   RE:SET — 03-store.js
   Local persistence, state shape, validation/sanitising, export and import.
   Data lives only in this browser's localStorage (key "reset.v1"). Nothing is
   sent anywhere; nothing is encrypted.
   ========================================================================== */

Store = RS.Store = {};
const KEY = 'reset.v1';
const SCHEMA = 1;
Store.KEY = KEY;
Store.SCHEMA = SCHEMA;

Store.PRESET_CATEGORIES = [
  { id: 'cat_study', name: 'Study' }, { id: 'cat_health', name: 'Health' }, { id: 'cat_fitness', name: 'Fitness' },
  { id: 'cat_growth', name: 'Personal growth' }, { id: 'cat_digital', name: 'Digital wellbeing' },
  { id: 'cat_creative', name: 'Creative work' }, { id: 'cat_other', name: 'Other' }
];
Store.JOURNAL_PROMPTS = [
  { id: 'well', text: 'What went well today?' },
  { id: 'improve', text: 'What would I like to improve tomorrow?' },
  { id: 'distract', text: 'What distracted me?' },
  { id: 'grateful', text: 'What am I grateful for?' },
  { id: 'learned', text: 'What did I learn today?' }
];

Store.defaultSettings = () => ({
  greeting: true, name: '', homeLayout: 'comfortable', quickActions: true, showCategory: true,
  sort: 'manual', weekStart: 1, dateFormat: 'DMY', timeFormat: '12h',
  density: 'comfortable', radius: 'soft', font: 'theme',
  animations: true, haptics: true, sounds: false, reducedMotion: 'system', splash: true,
  minimumMode: true, remindersEnabled: false,
  journalEnabled: true, journalPrompts: true, journalPromptIds: Store.JOURNAL_PROMPTS.map(p => p.id),
  wellbeingEnabled: true, wellbeingName: 'Digital Wellbeing',
  progressEnabled: true, keepAwake: true,
  focusMinutes: 25, focusSound: 'off', focusVolume: 0.4
});

Store.defaultState = () => ({
  app: 'RE:SET', v: SCHEMA,
  settings: Store.defaultSettings(),
  theme: { id: 'obsidian', mode: 'fixed', lightId: 'paper', darkId: 'obsidian', custom: Object.assign({}, RS.Themes.DEFAULT_CUSTOM) },
  categories: Store.PRESET_CATEGORIES.map(c => Object.assign({}, c)),
  habits: [], records: {}, sessions: [], focus: null,
  journal: [], urges: [], replacements: [], milestones: {},
  meta: { createdAt: RS.now(), lastExportAt: 0 }
});

/* ---- sanitising ---------------------------------------------------------- */
const T = {
  str: (v, max, def) => (typeof v === 'string' ? v.slice(0, max) : (def === undefined ? '' : def)),
  num: (v, lo, hi, def) => { const n = Util.num(v); return n !== null && n >= lo && n <= hi ? n : def; },
  oneOf: (v, list, def) => (list.indexOf(v) >= 0 ? v : def),
  bool: (v, def) => (typeof v === 'boolean' ? v : def),
  key: (v, def) => (Util.isKey(v) ? v : def),
  id: v => (typeof v === 'string' && /^[\w-]{1,64}$/.test(v) ? v : null),
  time: v => (typeof v === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(v) ? v : '')
};

const SETTING_RULES = {
  greeting: ['bool'], name: ['str', 40], homeLayout: ['enum', ['comfortable', 'compact']], quickActions: ['bool'], showCategory: ['bool'],
  sort: ['enum', ['manual', 'name', 'category', 'status']], weekStart: ['enum', [0, 1, 6]], dateFormat: ['enum', ['DMY', 'MDY', 'YMD']],
  timeFormat: ['enum', ['12h', '24h']], density: ['enum', ['comfortable', 'compact']], radius: ['enum', ['sharp', 'soft', 'round']],
  font: ['enum', ['theme', 'sans', 'serif', 'mono']], animations: ['bool'], haptics: ['bool'], sounds: ['bool'],
  reducedMotion: ['enum', ['system', 'on', 'off']], splash: ['bool'], minimumMode: ['bool'], remindersEnabled: ['bool'],
  journalEnabled: ['bool'], journalPrompts: ['bool'], wellbeingEnabled: ['bool'], wellbeingName: ['str', 30],
  progressEnabled: ['bool'], keepAwake: ['bool'], focusMinutes: ['num', 1, 600], focusSound: ['enum', ['off', 'brown', 'pink', 'white']],
  focusVolume: ['num', 0, 1]
};

function sanitizeSettings(raw, issues) {
  const def = Store.defaultSettings(), out = {};
  raw = raw && typeof raw === 'object' ? raw : {};
  Object.keys(def).forEach(k => {
    const r = SETTING_RULES[k], v = raw[k];
    if (k === 'journalPromptIds') {
      const valid = Store.JOURNAL_PROMPTS.map(p => p.id);
      out[k] = Array.isArray(v) ? v.filter(x => valid.indexOf(x) >= 0) : def[k];
    } else if (!r) out[k] = def[k];
    else if (r[0] === 'bool') out[k] = T.bool(v, def[k]);
    else if (r[0] === 'str') out[k] = T.str(v, r[1], def[k]);
    else if (r[0] === 'enum') out[k] = T.oneOf(v, r[1], def[k]);
    else if (r[0] === 'num') out[k] = T.num(v, r[1], r[2], def[k]);
  });
  return out;
}

function sanitizeTheme(raw) {
  const def = Store.defaultState().theme, ids = RS.Themes.BUILTIN.map(t => t.id).concat('custom');
  raw = raw && typeof raw === 'object' ? raw : {};
  const c = raw.custom && typeof raw.custom === 'object' ? raw.custom : {};
  const hx = (v, d) => (RS.Themes.color.validHex(v) ? v : d);
  return {
    id: T.oneOf(raw.id, ids, def.id), mode: T.oneOf(raw.mode, ['fixed', 'device'], 'fixed'),
    lightId: T.oneOf(raw.lightId, ids, def.lightId), darkId: T.oneOf(raw.darkId, ids, def.darkId),
    custom: {
      bg: hx(c.bg, def.custom.bg), surface: hx(c.surface, def.custom.surface), accent: hx(c.accent, def.custom.accent),
      accent2: hx(c.accent2, def.custom.accent2), base: T.oneOf(c.base, ['dark', 'light'], 'dark'),
      contrast: T.oneOf(c.contrast, ['low', 'normal', 'high'], 'normal')
    }
  };
}

function sanitizeVersion(v, fallbackFrom, type) {
  if (!v || typeof v !== 'object') return null;
  const s = v.schedule && typeof v.schedule === 'object' ? v.schedule : {};
  const from = T.key(v.from, fallbackFrom);
  if (!from) return null;
  const out = RS.Habits.normVersion({
    from, schedule: s,
    target: v.target, minTarget: v.minTarget, minLabel: v.minLabel, unit: v.unit
  }, type);
  return out;
}

function sanitizeHabit(h, issues) {
  if (!h || typeof h !== 'object') return null;
  const id = T.id(h.id), name = T.str(h.name, 80).trim();
  if (!id || !name) { issues.push('A habit without a valid id or name was skipped.'); return null; }
  const type = T.oneOf(h.type, ['check', 'measure', 'limit'], null);
  if (!type) { issues.push('Habit "' + name + '" has an unknown type and was skipped.'); return null; }
  const versions = (Array.isArray(h.versions) ? h.versions : []).map(v => sanitizeVersion(v, null, type)).filter(Boolean)
    .sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0));
  if (!versions.length) { issues.push('Habit "' + name + '" has no valid schedule and was skipped.'); return null; }
  const inactive = (Array.isArray(h.inactive) ? h.inactive : []).map(r => {
    if (!r || !Util.isKey(r.from)) return null;
    return { from: r.from, to: Util.isKey(r.to) ? r.to : null, kind: r.kind === 'archive' ? 'archive' : 'pause' };
  }).filter(Boolean);
  const rem = h.reminder && typeof h.reminder === 'object' ? h.reminder : {};
  return {
    id, name, description: T.str(h.description, 300), icon: Icons.has(h.icon) ? h.icon : 'check',
    category: T.id(h.category), type,
    color: Object.prototype.hasOwnProperty.call(RS.Themes.HABIT_COLORS, h.color) ? h.color : 'theme',
    notes: T.str(h.notes, 1000), wb: h.wb === true,
    reminder: { enabled: T.bool(rem.enabled, false) && !!T.time(rem.time), time: T.time(rem.time) },
    createdAt: versions[0].from, versions, inactive
  };
}

function sanitizeRecords(raw, habitIds, issues) {
  const out = {}; let dropped = 0;
  if (raw && typeof raw === 'object') {
    Object.keys(raw).forEach(hid => {
      if (!habitIds[hid]) { dropped += raw[hid] && typeof raw[hid] === 'object' ? Object.keys(raw[hid]).length : 1; return; }
      const days = raw[hid]; if (!days || typeof days !== 'object') return;
      Object.keys(days).forEach(key => {
        const r = days[key];
        if (!Util.isKey(key) || !r || typeof r !== 'object') { dropped++; return; }
        const status = T.oneOf(r.status, ['done', 'minimum', 'partial', 'over', 'skipped'], null);
        if (!status) { dropped++; return; }
        (out[hid] = out[hid] || {})[key] = {
          status, value: r.value === null || r.value === undefined ? null : T.num(r.value, 0, 1e7, null),
          target: r.target === null || r.target === undefined ? null : T.num(r.target, 0, 1e7, null),
          note: T.str(r.note, 500), at: T.num(r.at, 0, 4e12, 0)
        };
      });
    });
  }
  if (dropped) issues.push(dropped + ' record(s) that could not be matched to a habit or were malformed were ignored.');
  return out;
}

function list(raw, max) { return Array.isArray(raw) ? raw.slice(0, max) : []; }

Store.sanitize = function (raw) {
  const issues = [];
  const base = Store.defaultState();
  raw = raw && typeof raw === 'object' ? raw : {};
  const st = {
    app: 'RE:SET', v: SCHEMA,
    settings: sanitizeSettings(raw.settings, issues),
    theme: sanitizeTheme(raw.theme)
  };
  // categories
  const seenC = {};
  st.categories = list(raw.categories, 100).map(c => {
    const id = c && T.id(c.id), name = c && T.str(c.name, 40).trim();
    if (!id || !name || seenC[id]) return null; seenC[id] = 1; return { id, name };
  }).filter(Boolean);
  if (!Array.isArray(raw.categories)) st.categories = base.categories;
  // habits
  const seen = {};
  st.habits = list(raw.habits, 500).map(h => sanitizeHabit(h, issues)).filter(h => { if (!h) return false; if (seen[h.id]) { issues.push('A duplicate habit id was skipped.'); return false; } seen[h.id] = 1; return true; });
  st.habits.forEach(h => { if (h.category && !seenC[h.category]) h.category = null; });
  st.records = sanitizeRecords(raw.records, seen, issues);
  // focus sessions
  st.sessions = list(raw.sessions, 20000).map(s => {
    if (!s || typeof s !== 'object') return null;
    const id = T.id(s.id); const actualSec = T.num(s.actualSec, 0, 86400 * 2, null);
    if (!id || actualSec === null) return null;
    return {
      id, startedAt: T.num(s.startedAt, 0, 4e12, 0), endedAt: T.num(s.endedAt, 0, 4e12, 0),
      label: T.str(s.label, 80), habitId: s.habitId && seen[s.habitId] ? s.habitId : null,
      plannedMin: T.num(s.plannedMin, 0, 600, 0), actualSec, completed: s.completed === true, note: T.str(s.note, 500)
    };
  }).filter(Boolean);
  // active focus session
  const f = raw.focus;
  st.focus = null;
  if (f && typeof f === 'object' && T.id(f.id) && T.oneOf(f.status, ['running', 'paused', 'finished'], null)) {
    st.focus = {
      id: f.id, status: f.status, label: T.str(f.label, 80), habitId: f.habitId && seen[f.habitId] ? f.habitId : null,
      plannedMs: T.num(f.plannedMs, 60000, 600 * 60000, 25 * 60000), startedAt: T.num(f.startedAt, 0, 4e12, RS.now()),
      runStartedAt: f.status === 'running' ? T.num(f.runStartedAt, 0, 4e12, RS.now()) : null,
      accumulatedMs: T.num(f.accumulatedMs, 0, 1e9, 0)
    };
  }
  // journal
  st.journal = list(raw.journal, 20000).map(e => {
    if (!e || typeof e !== 'object') return null;
    const id = T.id(e.id), date = T.key(e.date, null);
    if (!id || !date) return null;
    return { id, date, text: T.str(e.text, 20000), mood: T.num(e.mood, 1, 5, null), createdAt: T.num(e.createdAt, 0, 4e12, 0), updatedAt: T.num(e.updatedAt, 0, 4e12, 0) };
  }).filter(Boolean);
  // wellbeing extras
  st.replacements = list(raw.replacements, 50).map(r => { const id = r && T.id(r.id), name = r && T.str(r.name, 60).trim(); return id && name ? { id, name } : null; }).filter(Boolean);
  const repIds = {}; st.replacements.forEach(r => { repIds[r.id] = 1; });
  st.urges = list(raw.urges, 20000).map(u => {
    if (!u || typeof u !== 'object') return null;
    const id = T.id(u.id), date = T.key(u.date, null), action = T.oneOf(u.action, ['delay', 'switch', 'continue'], null);
    if (!id || !date || !action) return null;
    return { id, date, at: T.num(u.at, 0, 4e12, 0), habitId: u.habitId && seen[u.habitId] ? u.habitId : null, action, replacementId: u.replacementId && repIds[u.replacementId] ? u.replacementId : null, note: T.str(u.note, 300) };
  }).filter(Boolean);
  // milestones
  st.milestones = {};
  if (raw.milestones && typeof raw.milestones === 'object') Object.keys(raw.milestones).forEach(k => { if (/^[\w-]{1,40}$/.test(k) && Util.isKey(raw.milestones[k])) st.milestones[k] = raw.milestones[k]; });
  const meta = raw.meta && typeof raw.meta === 'object' ? raw.meta : {};
  st.meta = { createdAt: T.num(meta.createdAt, 0, 4e12, RS.now()), lastExportAt: T.num(meta.lastExportAt, 0, 4e12, 0) };
  return { state: st, issues };
};

/* ---- persistence --------------------------------------------------------- */
Store.state = null;
Store.status = { available: true, error: null, notice: null, persisted: false };
const subs = [], statusSubs = [];
Store.subscribe = fn => { subs.push(fn); return () => { const i = subs.indexOf(fn); if (i >= 0) subs.splice(i, 1); }; };
Store.onStatus = fn => { statusSubs.push(fn); };
function emitStatus() { statusSubs.forEach(f => { try { f(Store.status); } catch (e) { console.error(e); } }); }

let memoryOnly = null; // used when localStorage is unavailable
function readRaw() {
  try { return localStorage.getItem(KEY); }
  catch (e) { Store.status.available = false; Store.status.error = 'Browser storage is unavailable here, so changes will not be kept after you close the app.'; return memoryOnly; }
}

Store.init = function () {
  const raw = readRaw();
  if (raw) {
    try {
      const res = Store.sanitize(JSON.parse(raw));
      Store.state = res.state;
      if (res.issues.length) Store.status.notice = 'Some saved data could not be read and was skipped.';
    } catch (e) {
      // Corrupt JSON: keep the raw text safe, never overwrite it silently.
      try { localStorage.setItem(KEY + '.corrupt-backup', raw); } catch (e2) { /* ignore */ }
      Store.state = Store.defaultState();
      Store.status.notice = 'Saved data could not be read. A copy of it was kept in browser storage and the app started fresh.';
    }
  } else {
    Store.state = Store.defaultState();
  }
  Store.status.available = Store.status.available && Store.probe();
  if (!Store.status.available && !Store.status.error) Store.status.error = 'Browser storage is unavailable here, so changes will not be kept after you close the app.';
  emitStatus();
  return Store.state;
};

Store.probe = () => { try { localStorage.setItem('reset.probe', '1'); localStorage.removeItem('reset.probe'); return true; } catch (e) { return false; } };

Store.save = function () {
  const json = JSON.stringify(Store.state);
  try {
    localStorage.setItem(KEY, json);
    if (Store.status.error && Store.status.available) { Store.status.error = null; emitStatus(); }
    return true;
  } catch (e) {
    memoryOnly = json;
    Store.status.error = (e && e.name === 'QuotaExceededError')
      ? 'Browser storage is full. Recent changes are not saved — export a backup from Settings → Data & privacy.'
      : 'Changes could not be saved to browser storage. Export a backup from Settings → Data & privacy.';
    emitStatus();
    return false;
  }
};
const saveSoon = Util.debounce(() => Store.save(), 150);
Store.flush = () => saveSoon.flush();

let notifyPending = false;
function notify() {
  if (notifyPending) return;
  notifyPending = true;
  Promise.resolve().then(() => { notifyPending = false; subs.slice().forEach(f => { try { f(); } catch (e) { console.error(e); } }); });
}

/* Mutate state through this so saving and re-rendering always happen. */
Store.update = function (mutator, opts) {
  mutator(Store.state);
  saveSoon();
  if (!(opts && opts.silent)) notify();
};

Store.replaceAll = function (newState) {
  Store.state = newState;
  Store.save();
  notify();
};

Store.resetPreferences = function () {
  Store.update(st => { const d = Store.defaultState(); st.settings = d.settings; st.theme = d.theme; });
};

Store.deleteAll = function () {
  Store.state = Store.defaultState();
  try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.corrupt-backup'); } catch (e) { /* ignore */ }
  Store.save();
  notify();
};

/* ---- export / import ----------------------------------------------------- */
Store.exportObject = () => {
  const st = Util.clone(Store.state);
  return { app: 'RE:SET', v: SCHEMA, appVersion: RS.BUILD.version, exportedAt: new Date(RS.now()).toISOString(), data: st };
};
Store.exportJSON = () => JSON.stringify(Store.exportObject(), null, 2);

Store.estimateBytes = () => { try { return new Blob([JSON.stringify(Store.state)]).size; } catch (e) { return JSON.stringify(Store.state).length; } };

/* Validate text from an export file. Never touches live state. */
Store.parseImport = function (text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { ok: false, error: 'This file is not valid JSON, so nothing was imported.' }; }
  if (!obj || typeof obj !== 'object' || obj.app !== 'RE:SET') return { ok: false, error: 'This does not look like a RE:SET export (missing app marker), so nothing was imported.' };
  if (typeof obj.v !== 'number' || obj.v > SCHEMA) return { ok: false, error: 'This export was made by a newer version of RE:SET (' + obj.v + '). Update the app and try again.' };
  if (!obj.data || typeof obj.data !== 'object') return { ok: false, error: 'The export has no data section, so nothing was imported.' };
  if (!Array.isArray(obj.data.habits) || typeof obj.data.records !== 'object' || obj.data.records === null) return { ok: false, error: 'The export is missing habits or records, so nothing was imported.' };
  const res = Store.sanitize(obj.data);
  const nRecords = Object.keys(res.state.records).reduce((s, k) => s + Object.keys(res.state.records[k]).length, 0);
  return {
    ok: true, state: res.state, issues: res.issues, exportedAt: obj.exportedAt || null,
    summary: { habits: res.state.habits.length, records: nRecords, sessions: res.state.sessions.length, journal: res.state.journal.length }
  };
};

}

/* ===== 04-habits.js ===== */
{
/* ==========================================================================
   RE:SET — 04-habits.js
   Habit definitions, scheduling, and completion records.

   Design rules that keep history honest:
   - Habits have stable ids; names/icons can change without touching records.
   - Schedule + target live in dated `versions`. Editing them adds a new
     version effective from today, so past days keep the schedule and target
     they were recorded under.
   - Pausing/archiving is a dated range, so days before it are unaffected.
   - Records are stored separately: records[habitId][YYYY-MM-DD].
   ========================================================================== */

Habits = RS.Habits = {};
const state = () => RS.Store.state;

Habits.SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
Habits.TYPE_LABELS = { check: 'Completion', measure: 'Measurable', limit: 'Limit' };

/* ---- normalisation ------------------------------------------------------- */
Habits.normSchedule = s => {
  s = s || {};
  const mode = ['daily', 'days', 'interval', 'weekly'].indexOf(s.mode) >= 0 ? s.mode : 'daily';
  const days = mode === 'days' ? Array.from(new Set((Array.isArray(s.days) ? s.days : []).map(Number).filter(d => d >= 0 && d <= 6))).sort((a, b) => a - b) : [];
  return {
    mode, days: mode === 'days' && !days.length ? [1, 2, 3, 4, 5] : days,
    every: mode === 'interval' ? Util.clamp(Util.int(s.every, 2), 2, 60) : 0,
    anchor: mode === 'interval' ? (Util.isKey(s.anchor) ? s.anchor : Util.today()) : '',
    perWeek: mode === 'weekly' ? Util.clamp(Util.int(s.perWeek, 3), 1, 7) : 0
  };
};

Habits.normVersion = (v, type) => {
  const tn = Util.num(v.target), mn = Util.num(v.minTarget);
  let target = null, minTarget = null, minLabel = '', unit = '';
  if (type === 'measure') {
    target = tn !== null && tn > 0 ? Math.min(tn, 1e6) : 1;
    minTarget = mn !== null && mn > 0 && mn < target ? mn : null;
    unit = typeof v.unit === 'string' ? v.unit.trim().slice(0, 16) : '';
  } else if (type === 'limit') {
    target = tn !== null && tn >= 0 ? Math.min(tn, 1e6) : 0;
    unit = typeof v.unit === 'string' ? v.unit.trim().slice(0, 16) : '';
  } else {
    minLabel = typeof v.minLabel === 'string' ? v.minLabel.trim().slice(0, 60) : '';
  }
  return { from: v.from, schedule: Habits.normSchedule(v.schedule), target, minTarget, minLabel, unit };
};
const stripFrom = v => { const c = Object.assign({}, v); delete c.from; return c; };

/* ---- lookups ------------------------------------------------------------- */
Habits.get = id => state().habits.find(h => h.id === id) || null;
Habits.version = (h, key) => {
  let v = h.versions[0];
  for (let i = 0; i < h.versions.length; i++) { if (h.versions[i].from <= key) v = h.versions[i]; else break; }
  return v;
};
Habits.current = h => h.versions[h.versions.length - 1];
Habits.catName = id => { const c = state().categories.find(x => x.id === id); return c ? c.name : ''; };
Habits.rec = (h, key) => (state().records[h.id] || {})[key] || null;
Habits.recordCount = h => Object.keys(state().records[h.id] || {}).length;

Habits.openRange = h => h.inactive.find(r => r.to === null) || null;
Habits.lifecycle = h => { const r = Habits.openRange(h); return r ? (r.kind === 'archive' ? 'archived' : 'paused') : 'active'; };
Habits.inactiveOn = (h, key) => h.inactive.some(r => key >= r.from && (r.to === null || key <= r.to));
Habits.activeOn = (h, key) => key >= h.createdAt && !Habits.inactiveOn(h, key);

Habits.isScheduled = (v, key) => {
  const s = v.schedule;
  if (s.mode === 'daily') return true;
  if (s.mode === 'days') return s.days.indexOf(Util.dow(key)) >= 0;
  if (s.mode === 'interval') { const d = Util.diffDays(s.anchor, key); return d >= 0 && d % s.every === 0; }
  return false; // 'weekly' goals are flexible: no specific day is "due"
};
Habits.isFlex = (h, key) => Habits.version(h, key).schedule.mode === 'weekly';

/* The status of one habit on one day. `kind` is one of:
   done | minimum | partial | over | skipped      (a record exists)
   missed | pending | unrecorded | unscheduled | inactive | future | flex  (no record) */
Habits.status = (h, key, today) => {
  today = today || Util.today();
  const rec = Habits.rec(h, key);
  if (rec) return { kind: rec.status, rec };
  if (!Habits.activeOn(h, key)) return { kind: 'inactive', rec: null };
  const v = Habits.version(h, key);
  if (v.schedule.mode === 'weekly') return { kind: key > today ? 'future' : 'flex', rec: null };
  if (!Habits.isScheduled(v, key)) return { kind: 'unscheduled', rec: null };
  if (key > today) return { kind: 'future', rec: null };
  if (h.type === 'limit') return { kind: key === today ? 'pending' : 'unrecorded', rec: null };
  return { kind: key === today ? 'pending' : 'missed', rec: null };
};

/* Habits relevant to a given day, split into scheduled / weekly-goal / not scheduled. */
Habits.listForDay = key => {
  const out = { scheduled: [], flex: [], other: [] };
  state().habits.forEach(h => {
    const rec = Habits.rec(h, key), active = Habits.activeOn(h, key);
    if (!active && !rec) return;
    if (Habits.isFlex(h, key)) { out.flex.push(h); return; }
    if (rec || Habits.isScheduled(Habits.version(h, key), key)) out.scheduled.push(h); else out.other.push(h);
  });
  return out;
};

const RANK = { pending: 0, missed: 0, partial: 0, over: 0, flex: 0, minimum: 1, done: 2, skipped: 3 };
Habits.sorted = (hs, key) => {
  const mode = state().settings.sort, order = state().habits;
  const idx = h => order.indexOf(h);
  const a = hs.slice();
  if (mode === 'name') a.sort((x, y) => x.name.localeCompare(y.name));
  else if (mode === 'category') a.sort((x, y) => (Habits.catName(x.category) || '~').localeCompare(Habits.catName(y.category) || '~') || idx(x) - idx(y));
  else if (mode === 'status') { const today = Util.today(); a.sort((x, y) => (RANK[Habits.status(x, key, today).kind] || 0) - (RANK[Habits.status(y, key, today).kind] || 0) || idx(x) - idx(y)); }
  else a.sort((x, y) => idx(x) - idx(y));
  return a;
};

/* Week progress for weekly-goal habits */
Habits.weekProgress = (h, key) => {
  const start = Util.startOfWeek(key, state().settings.weekStart), recs = state().records[h.id] || {};
  let done = 0, minimum = 0;
  for (let i = 0; i < 7; i++) { const r = recs[Util.addDays(start, i)]; if (r && r.status === 'done') done++; else if (r && r.status === 'minimum') minimum++; }
  return { done, minimum, goal: Habits.version(h, key).schedule.perWeek, start };
};

/* ---- descriptions -------------------------------------------------------- */
Habits.scheduleText = v => {
  const s = v.schedule;
  if (s.mode === 'daily') return 'Every day';
  if (s.mode === 'interval') return 'Every ' + s.every + ' days';
  if (s.mode === 'weekly') return s.perWeek + '× per week';
  if (s.days.length === 7) return 'Every day';
  const ws = state().settings.weekStart;
  const ordered = s.days.slice().sort((a, b) => ((a - ws + 7) % 7) - ((b - ws + 7) % 7));
  if (ordered.length === 5 && [1, 2, 3, 4, 5].every(d => ordered.indexOf(d) >= 0)) return 'Weekdays';
  if (ordered.length === 2 && ordered.indexOf(0) >= 0 && ordered.indexOf(6) >= 0) return 'Weekends';
  return ordered.map(d => Habits.SHORT_DAYS[d]).join(', ');
};
Habits.unitText = (v, n) => (v.unit ? ' ' + v.unit : '');
Habits.targetText = (h, v) => {
  if (h.type === 'measure') return Util.fmtNum(v.target) + (v.unit ? ' ' + v.unit : '');
  if (h.type === 'limit') return 'max ' + Util.fmtNum(v.target) + (v.unit ? ' ' + v.unit : '');
  return '';
};
Habits.versionSummary = (h, v) => {
  const parts = [Habits.scheduleText(v)];
  const t = Habits.targetText(h, v); if (t) parts.push(t);
  if (h.type === 'measure' && v.minTarget) parts.push('minimum ' + Util.fmtNum(v.minTarget) + (v.unit ? ' ' + v.unit : ''));
  if (h.type === 'check' && v.minLabel) parts.push('minimum: ' + v.minLabel);
  return parts.join(' · ');
};

/* ---- create / edit ------------------------------------------------------- */
Habits.create = input => {
  const id = Util.uid('h');
  const type = ['check', 'measure', 'limit'].indexOf(input.type) >= 0 ? input.type : 'check';
  const from = Util.isKey(input.start) && input.start <= Util.today() ? input.start : Util.today();
  const sched = Object.assign({}, input.schedule || {});
  if (sched.mode === 'interval') sched.anchor = from;
  const ver = Habits.normVersion({ from, schedule: sched, target: input.target, minTarget: input.minTarget, minLabel: input.minLabel, unit: input.unit }, type);
  const rem = input.reminder || {};
  const h = {
    id, name: String(input.name || '').trim().slice(0, 80), description: String(input.description || '').trim().slice(0, 300),
    icon: Icons.has(input.icon) ? input.icon : 'check', category: input.category || null, type,
    color: Object.prototype.hasOwnProperty.call(Themes.HABIT_COLORS, input.color) ? input.color : 'theme',
    notes: String(input.notes || '').trim().slice(0, 1000), wb: input.wb === true,
    reminder: { enabled: !!rem.enabled && !!rem.time, time: rem.time || '' },
    createdAt: from, versions: [ver], inactive: []
  };
  RS.Store.update(s => { s.habits.push(h); });
  return id;
};

/* patch: top-level fields + optional `ver` (schedule/target/unit/minimum) */
Habits.update = (id, patch) => RS.Store.update(s => {
  const h = s.habits.find(x => x.id === id); if (!h) return;
  ['name', 'description', 'icon', 'category', 'color', 'notes', 'reminder', 'wb'].forEach(k => { if (k in patch) h[k] = patch[k]; });
  if (patch.ver) {
    const today = Util.today(), cur = h.versions[h.versions.length - 1];
    const merged = Object.assign({}, cur, patch.ver, { from: cur.from });
    if (merged.schedule && merged.schedule.mode === 'interval' && patch.ver.schedule && !Util.same(patch.ver.schedule.every, cur.schedule.every)) merged.schedule = Object.assign({}, merged.schedule, { anchor: today });
    const next = Habits.normVersion(merged, h.type);
    if (!Util.same(stripFrom(next), stripFrom(cur))) {
      if (cur.from >= today) h.versions[h.versions.length - 1] = Object.assign(next, { from: cur.from });
      else h.versions.push(Object.assign(next, { from: today }));
    }
  }
});

/* ---- lifecycle ----------------------------------------------------------- */
function closeOpen(h, today) {
  const r = Habits.openRange(h); if (!r) return;
  if (r.from >= today) h.inactive.splice(h.inactive.indexOf(r), 1); else r.to = Util.addDays(today, -1);
}
Habits.pause = id => RS.Store.update(s => { const h = s.habits.find(x => x.id === id); if (!h || Habits.lifecycle(h) !== 'active') return; h.inactive.push({ from: Util.today(), to: null, kind: 'pause' }); });
Habits.archive = id => RS.Store.update(s => { const h = s.habits.find(x => x.id === id); if (!h || Habits.lifecycle(h) === 'archived') return; const t = Util.today(); closeOpen(h, t); h.inactive.push({ from: t, to: null, kind: 'archive' }); });
Habits.resume = id => RS.Store.update(s => { const h = s.habits.find(x => x.id === id); if (h) closeOpen(h, Util.today()); });
Habits.restore = Habits.resume;

Habits.remove = id => RS.Store.update(s => {
  s.habits = s.habits.filter(h => h.id !== id);
  delete s.records[id];
  s.sessions.forEach(x => { if (x.habitId === id) x.habitId = null; });
  s.urges.forEach(x => { if (x.habitId === id) x.habitId = null; });
  if (s.focus && s.focus.habitId === id) s.focus.habitId = null;
});

/* Move a habit one step among the habits currently visible in a list. */
Habits.move = (id, dir, visibleIds) => RS.Store.update(s => {
  const i = visibleIds.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= visibleIds.length) return;
  const a = s.habits.findIndex(h => h.id === id), b = s.habits.findIndex(h => h.id === visibleIds[j]);
  if (a < 0 || b < 0) return;
  const t = s.habits[a]; s.habits[a] = s.habits[b]; s.habits[b] = t;
});

/* ---- records ------------------------------------------------------------- */
Habits.statusForValue = (h, v, value) => {
  if (h.type === 'measure') {
    if (!(value > 0)) return null;
    if (value >= v.target) return 'done';
    if (state().settings.minimumMode && v.minTarget && value >= v.minTarget) return 'minimum';
    return 'partial';
  }
  if (h.type === 'limit') { if (value === null || !(value >= 0)) return null; return value <= v.target ? 'done' : 'over'; }
  return 'done';
};

Habits.writeRecord = (id, key, patch) => RS.Store.update(s => {
  const h = s.habits.find(x => x.id === id); if (!h) return;
  const v = Habits.version(h, key), recs = s.records[id] || (s.records[id] = {});
  const cur = recs[key] || { status: 'done', value: null, target: null, note: '', at: 0 };
  const clean = {}; Object.keys(patch).forEach(k => { if (patch[k] !== undefined) clean[k] = patch[k]; });
  recs[key] = Object.assign({}, cur, clean, { target: v.target, at: RS.now() });
});
Habits.clearRecord = (id, key) => RS.Store.update(s => {
  if (!s.records[id]) return;
  delete s.records[id][key];
  if (!Object.keys(s.records[id]).length) delete s.records[id];
});

/* Completion habits: level is 'done' or 'minimum'. */
Habits.logCheck = (id, key, level, note) => Habits.writeRecord(id, key, { status: level === 'minimum' ? 'minimum' : 'done', value: null, note: note === undefined ? undefined : note });
/* Measurable / limit habits: record an actual value (limit: null = "within limit, not measured"). */
Habits.logValue = (id, key, value, note) => {
  const h = Habits.get(id); if (!h) return null;
  const v = Habits.version(h, key);
  if (h.type === 'limit' && value === null) { Habits.writeRecord(id, key, { status: 'done', value: null, note }); return 'done'; }
  const status = Habits.statusForValue(h, v, value);
  if (!status) { Habits.clearRecord(id, key); return null; }
  Habits.writeRecord(id, key, { status, value, note });
  return status;
};
Habits.skip = (id, key, note) => Habits.writeRecord(id, key, { status: 'skipped', value: null, note });
Habits.setNote = (id, key, note) => { if (Habits.rec(Habits.get(id), key)) Habits.writeRecord(id, key, { note }); };

/* One-tap toggle used by the Today list. */
Habits.toggle = (h, key) => {
  const rec = Habits.rec(h, key);
  /* done / skipped / any limit record -> clear; minimum or partial -> upgrade to full */
  if (rec && (rec.status === 'done' || rec.status === 'skipped' || h.type === 'limit')) { Habits.clearRecord(h.id, key); return 'cleared'; }
  if (h.type === 'check') Habits.logCheck(h.id, key, 'done');
  else if (h.type === 'measure') Habits.logValue(h.id, key, Habits.version(h, key).target);
  else Habits.logValue(h.id, key, null);
  return 'done';
};

/* Add to today's value (used by focus sessions and wellbeing quick-adds). */
Habits.addValue = (id, key, delta) => {
  const h = Habits.get(id); if (!h || h.type === 'check') return;
  const rec = Habits.rec(h, key);
  const base = rec && typeof rec.value === 'number' ? rec.value : 0;
  Habits.logValue(id, key, Util.round(base + delta, 2));
};

}

/* ===== 05-analytics.js ===== */
{
/* ==========================================================================
   RE:SET — 05-analytics.js
   Every number shown in Insights is computed here from stored records.
   Rules:
   - Only days that are scheduled AND already settled count toward a rate.
   - Unscheduled, future, paused, skipped and unrecorded days are left out.
   - "Minimum" completions count as completed but are always reported apart
     from full completions so they never look like the full target.
   ========================================================================== */

Analytics = RS.Analytics = {};
const S = () => RS.Store.state;
const isDone = k => k === 'done' || k === 'minimum';

Analytics.firstDay = () => {
  let first = null;
  S().habits.forEach(h => { if (!first || h.createdAt < first) first = h.createdAt; });
  return first;
};

/* One calendar day across all habits. */
Analytics.day = (key, today) => {
  today = today || Util.today();
  const r = { key, done: 0, minimum: 0, partial: 0, over: 0, missed: 0, pending: 0, skipped: 0, unrecorded: 0, flexDone: 0 };
  S().habits.forEach(h => {
    const st = Habits.status(h, key, today), k = st.kind;
    if (Habits.isFlex(h, key)) { if (isDone(k)) r.flexDone++; return; }
    if (k in r) r[k]++;
  });
  r.completed = r.done + r.minimum;
  r.counted = r.completed + r.partial + r.over + r.missed;
  r.planned = r.counted + r.pending;
  r.rate = r.counted ? r.completed / r.counted : null;
  return r;
};

/* Calendar classification of a day. */
Analytics.dayKind = (d, today) => {
  today = today || Util.today();
  if (d.key > today) return 'future';
  if (d.counted > 0 && d.completed === d.counted && d.pending === 0) return 'complete';
  if (d.completed > 0) return 'partial';
  if (d.counted > 0) return d.pending > 0 ? 'open' : 'missed';
  if (d.pending > 0) return 'open';
  if (d.unrecorded > 0) return 'unrecorded';
  if (d.skipped > 0) return 'skipped';
  return 'none';
};

/* Totals across a date range (inclusive). Rate uses settled days only. */
Analytics.range = (from, to, today) => {
  today = today || Util.today();
  const out = { from, to, done: 0, minimum: 0, partial: 0, over: 0, missed: 0, skipped: 0, completed: 0, counted: 0, rateNum: 0, rateDen: 0, rate: null, days: 0, activeDays: 0 };
  const first = Analytics.firstDay();
  if (!first) return out;
  const a = from < first ? first : from, b = to > today ? today : to;
  if (a > b) return out;
  for (let k = a, g = 0; k <= b && g < 4000; k = Util.addDays(k, 1), g++) {
    const d = Analytics.day(k, today);
    out.days++;
    ['done', 'minimum', 'partial', 'over', 'missed', 'skipped'].forEach(f => { out[f] += d[f]; });
    out.completed += d.completed; out.counted += d.counted;
    if (d.completed > 0) out.activeDays++;
    if (d.counted && (k < today || d.pending === 0)) { out.rateNum += d.completed; out.rateDen += d.counted; }
  }
  out.rate = out.rateDen ? out.rateNum / out.rateDen : null;
  return out;
};

/* Rolling completion rate over the last n days (ending today). */
Analytics.rolling = (n, today) => {
  today = today || Util.today();
  return Analytics.range(Util.addDays(today, -(n - 1)), today, today);
};

Analytics.daily = (from, to, today) => {
  today = today || Util.today();
  const out = [], first = Analytics.firstDay();
  for (let k = from, g = 0; k <= to && g < 4000; k = Util.addDays(k, 1), g++) {
    const d = (first && k >= first && k <= today) ? Analytics.day(k, today) : null;
    out.push({ key: k, d, rate: d && d.counted && (k < today || d.pending === 0) ? d.completed / d.counted : null });
  }
  return out;
};

const bucket = (a, b, today, keyOf, labelOf) => {
  const groups = [], map = {};
  for (let k = a, g = 0; k <= b && g < 4000; k = Util.addDays(k, 1), g++) {
    const id = keyOf(k);
    if (!map[id]) { map[id] = { id, start: k, end: k, num: 0, den: 0, completed: 0 }; groups.push(map[id]); }
    const o = map[id], first = Analytics.firstDay();
    o.end = k;
    if (first && k >= first && k <= today) {
      const d = Analytics.day(k, today);
      o.completed += d.completed;
      if (d.counted && (k < today || d.pending === 0)) { o.num += d.completed; o.den += d.counted; }
    }
  }
  groups.forEach(o => { o.rate = o.den ? o.num / o.den : null; o.label = labelOf(o); });
  return groups;
};

Analytics.weekly = (nWeeks, today) => {
  today = today || Util.today();
  const ws = S().settings.weekStart, cur = Util.startOfWeek(today, ws), a = Util.addDays(cur, -7 * (nWeeks - 1));
  return bucket(a, Util.addDays(cur, 6), today, k => Util.startOfWeek(k, ws), o => o.start);
};
Analytics.monthly = (nMonths, today) => {
  today = today || Util.today();
  const cur = Util.monthStart(today), a = Util.addMonths(cur, -(nMonths - 1));
  return bucket(a, Util.addDays(Util.addMonths(cur, 1), -1), today, k => k.slice(0, 7), o => o.start);
};

/* One habit over a range. */
Analytics.habit = (h, from, to, today) => {
  today = today || Util.today();
  const o = { done: 0, minimum: 0, partial: 0, over: 0, missed: 0, skipped: 0, completed: 0, counted: 0, rate: null, sum: 0, recorded: 0, avg: null };
  const a = from < h.createdAt ? h.createdAt : from, b = to > today ? today : to;
  for (let k = a, g = 0; k <= b && g < 4000; k = Util.addDays(k, 1), g++) {
    const st = Habits.status(h, k, today), kind = st.kind;
    if (kind in o && kind !== 'completed') o[kind]++;
    if (st.rec && typeof st.rec.value === 'number') { o.sum += st.rec.value; o.recorded++; }
  }
  o.completed = o.done + o.minimum;
  o.counted = o.completed + o.partial + o.over + o.missed;
  o.rate = o.counted ? o.completed / o.counted : null;
  o.avg = o.recorded ? o.sum / o.recorded : null;
  return o;
};

/* Consecutive scheduled days completed. Unscheduled, skipped and not-yet-settled
   days neither extend nor break a streak. Returns null for weekly-goal habits. */
Analytics.streak = (h, today) => {
  today = today || Util.today();
  if (Habits.current(h).schedule.mode === 'weekly') return null;
  let run = 0, best = 0;
  for (let k = h.createdAt, g = 0; k <= today && g < 4000; k = Util.addDays(k, 1), g++) {
    const kind = Habits.status(h, k, today).kind;
    if (isDone(kind)) { run++; if (run > best) best = run; }
    else if (kind === 'missed' || ((kind === 'partial' || kind === 'over') && k < today)) run = 0;
  }
  return { current: run, longest: best };
};

/* Weeks in which a weekly-goal habit met its goal. The current week is only
   counted once the goal is met, so an unfinished week is never a "miss". */
Analytics.weeklyGoal = (h, from, to, today) => {
  today = today || Util.today();
  const ws = S().settings.weekStart, thisWeek = Util.startOfWeek(today, ws);
  let weeks = 0, met = 0;
  let k = Util.startOfWeek(from < h.createdAt ? h.createdAt : from, ws);
  for (let g = 0; k <= to && k <= today && g < 400; k = Util.addDays(k, 7), g++) {
    const end = Util.addDays(k, 6), v = Habits.version(h, end < today ? end : today);
    if (v.schedule.mode !== 'weekly') continue;
    let n = 0;
    for (let i = 0; i < 7; i++) { const r = Habits.rec(h, Util.addDays(k, i)); if (r && isDone(r.status)) n++; }
    if (n >= v.schedule.perWeek) { weeks++; met++; } else if (k < thisWeek) weeks++;
  }
  return { weeks, met };
};

Analytics.byCategory = (from, to, today) => {
  const cats = S().categories.map(c => ({ id: c.id, name: c.name })).concat([{ id: null, name: 'No category' }]);
  return cats.map(c => {
    const hs = S().habits.filter(h => (h.category || null) === c.id);
    const agg = { id: c.id, name: c.name, habits: hs.length, completed: 0, counted: 0, rate: null };
    hs.forEach(h => { const r = Analytics.habit(h, from, to, today); agg.completed += r.completed; agg.counted += r.counted; });
    agg.rate = agg.counted ? agg.completed / agg.counted : null;
    return agg;
  }).filter(c => c.habits > 0);
};

/* Last n day statuses for a habit, oldest first (used for mini history strips). */
Analytics.habitDays = (h, n, today) => {
  today = today || Util.today();
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const k = Util.addDays(today, -i); out.push({ key: k, kind: Habits.status(h, k, today).kind }); }
  return out;
};

Analytics.totalCompleted = () => {
  let n = 0;
  const recs = S().records;
  Object.keys(recs).forEach(id => Object.keys(recs[id]).forEach(k => { if (isDone(recs[id][k].status)) n++; }));
  return n;
};

/* Focus */
Analytics.sessionDay = s => Util.keyOf(new Date(s.startedAt || s.endedAt || 0));
Analytics.focus = (from, to) => {
  let n = 0, sec = 0;
  S().sessions.forEach(s => { const k = Analytics.sessionDay(s); if (k >= from && k <= to) { n++; sec += s.actualSec; } });
  return { sessions: n, seconds: sec };
};
Analytics.hasData = () => S().habits.length > 0 && (Analytics.totalCompleted() > 0 || Object.keys(S().records).length > 0);

}

/* ===== 06-focus.js ===== */
{
/* ==========================================================================
   RE:SET — 06-focus.js
   Focus timer. The session lives in saved state with timestamps, so it keeps
   exact time across screens, reloads and a sleeping phone. (A web page cannot
   ring while the app is closed — the time is simply correct when you return.)
   Finishing a timer never marks a habit complete; the person confirms that.
   ========================================================================== */

Focus = RS.Focus = {};
Focus.PRESETS = [15, 25, 45, 60];

Focus.cur = () => RS.Store.state.focus;
Focus.elapsed = f => (f ? f.accumulatedMs + (f.status === 'running' ? Math.max(0, RS.now() - f.runStartedAt) : 0) : 0);
Focus.remaining = f => Math.max(0, f.plannedMs - Focus.elapsed(f));

Focus.start = opts => {
  if (Focus.cur()) return false;
  const minutes = Util.clamp(Util.num(opts.minutes) || 25, 1, 600);
  RS.Store.update(s => {
    s.focus = {
      id: Util.uid('f'), status: 'running', label: String(opts.label || '').trim().slice(0, 80),
      habitId: opts.habitId && s.habits.some(h => h.id === opts.habitId) ? opts.habitId : null,
      plannedMs: Math.round(minutes * 60000), startedAt: RS.now(), runStartedAt: RS.now(), accumulatedMs: 0
    };
    s.settings.focusMinutes = Math.round(minutes);
  });
  return true;
};
Focus.pause = () => RS.Store.update(s => {
  const f = s.focus; if (!f || f.status !== 'running') return;
  f.accumulatedMs = Math.min(f.plannedMs, Focus.elapsed(f)); f.runStartedAt = null; f.status = 'paused';
});
Focus.resume = () => RS.Store.update(s => {
  const f = s.focus; if (!f || f.status !== 'paused') return;
  f.runStartedAt = RS.now(); f.status = 'running';
});
/* End now: stop the clock and move to the review step (save or discard). */
Focus.endNow = () => RS.Store.update(s => {
  const f = s.focus; if (!f || f.status === 'finished') return;
  f.accumulatedMs = Math.min(f.plannedMs, Focus.elapsed(f)); f.runStartedAt = null; f.status = 'finished';
});
/* Call regularly. Returns true the moment a running session reaches its length. */
Focus.tick = () => {
  const f = Focus.cur();
  if (!f || f.status !== 'running' || Focus.elapsed(f) < f.plannedMs) return false;
  RS.Store.update(s => { s.focus.status = 'finished'; s.focus.accumulatedMs = s.focus.plannedMs; s.focus.runStartedAt = null; });
  return true;
};

/* Save what was actually focused (finished or ended early) as a session. */
Focus.save = note => {
  const f = Focus.cur(); if (!f) return null;
  const sec = Math.round(Math.min(Focus.elapsed(f), f.plannedMs) / 1000);
  let sess = null;
  RS.Store.update(s => {
    const ff = s.focus;
    sess = { id: Util.uid('s'), startedAt: ff.startedAt, endedAt: RS.now(), label: ff.label, habitId: ff.habitId, plannedMin: Util.round(ff.plannedMs / 60000, 2), actualSec: sec, completed: sec * 1000 >= ff.plannedMs - 1000, note: String(note || '').slice(0, 500) };

};
Focus.discard = () => RS.Store.update(s => { s.focus = null; });
Focus.removeSession = id => RS.Store.update(s => { s.sessions = s.sessions.filter(x => x.id !== id); });
Focus.history = n => RS.Store.state.sessions.slice().sort((a, b) => b.startedAt - a.startedAt).slice(0, n || 30);

Focus.soundKind = () => snd.kind;
Focus.setVolume = v => { if (snd.gain) snd.gain.gain.value = Util.clamp(v, 0, 1) * 0.5; };

/* ---- Digital Wellbeing --------------------------------------------------- */
/* Tracked activities are limit habits flagged `wb`, so calendar, insights and
   history all use the same records. Usage is entered by hand — RE:SET does not
   read system screen time and cannot block apps. */
Wellbeing = RS.Wellbeing = {};
Wellbeing.activities = () => RS.Store.state.habits.filter(h => h.wb && h.type === 'limit' && Habits.lifecycle(h) !== 'archived');
Wellbeing.add = (name, unit, limit) => Habits.create({
  name, type: 'limit', unit: unit || 'min', target: limit, icon: 'phone', wb: true, category: RS.Store.state.categories.some(c => c.id === 'cat_digital') ? 'cat_digital' : null,
  schedule: { mode: 'daily' }
});
/* last 7 days: [{key, value, limit, kind}] */
Wellbeing.week = (h, today) => {
  today = today || Util.today();
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const k = Util.addDays(today, -i), st = Habits.status(h, k, today), v = Habits.version(h, k);
    out.push({ key: k, kind: st.kind, value: st.rec && typeof st.rec.value === 'number' ? st.rec.value : null, limit: v.target, within: st.rec ? st.rec.status === 'done' : null, active: Habits.activeOn(h, k) });
  }
  return out;
};
Wellbeing.weekSummary = (h, today) => {
  const w = Wellbeing.week(h, today).filter(d => d.active && d.kind !== 'future');
  const measured = w.filter(d => d.value !== null), recorded = w.filter(d => d.within !== null);
  return {
    recordedDays: recorded.length, withinDays: recorded.filter(d => d.within).length,
    avg: measured.length ? measured.reduce((s, d) => s + d.value, 0) / measured.length : null, measuredDays: measured.length
  };
};
Wellbeing.ACTIONS = [

/* ---- Personal progress (optional, never punitive) -------------------------- */
/* Milestones are only ever added. Missing days cannot remove or reset one. */
Progress = RS.Progress = {};
const activeDaySet = () => {
  const set = {}, recs = RS.Store.state.records;
  Object.keys(recs).forEach(id => Object.keys(recs[id]).forEach(k => { const st = recs[id][k].status; if (st === 'done' || st === 'minimum') set[k] = 1; }));
  return Object.keys(set).sort();
};
Progress.DEFS = [
  { id: 'first_done', name: 'First habit completed', desc: 'Complete any habit once.', test: d => d.days.length >= 1 },
  { id: 'first_focus', name: 'First focus session', desc: 'Save one focus session.', test: d => d.sessions >= 1 },
  { id: 'first_journal', name: 'First journal entry', desc: 'Write one journal entry.', test: d => d.journal >= 1 },
  { id: 'first_week', name: 'First full week', desc: 'Complete habits on 7 different days.', test: d => d.days.length >= 7 },
  { id: 'first_month', name: 'First month of tracking', desc: '30 days since your first completion, with at least 10 active days.', test: d => d.days.length >= 10 && d.days[0] <= Util.addDays(Util.today(), -29) },
  { id: 'focus_25', name: '25 focus sessions', desc: 'Save 25 focus sessions in total.', test: d => d.sessions >= 25 }
];
Progress.evaluate = () => {
  const s = RS.Store.state;
  if (!s.settings.progressEnabled) return [];
  const data = { days: activeDaySet(), sessions: s.sessions.length, journal: Journal.count() };
  const fresh = Progress.DEFS.filter(d => !s.milestones[d.id] && d.test(data));
  if (fresh.length) RS.Store.update(st => { fresh.forEach(d => { st.milestones[d.id] = Util.today(); }); }, { silent: true });
  return fresh;
};

/* ---- Reminders ------------------------------------------------------------ */
/* Honest scope: the browser can only show these while RE:SET is open (or while
   the browser keeps it alive). It cannot promise delivery when the app is closed. */
Reminders = RS.Reminders = {};
Reminders.supported = () => typeof Notification !== 'undefined';
Reminders.permission = () => (Reminders.supported() ? Notification.permission : 'unsupported');
Reminders.request = () => (Reminders.supported() ? Notification.requestPermission() : Promise.resolve('unsupported'));
const fired = {};
Reminders.check = () => {
  const s = RS.Store.state;
  if (!s.settings.remindersEnabled || Reminders.permission() !== 'granted') return;
  const now = new Date(RS.now()), hm = Util.pad(now.getHours()) + ':' + Util.pad(now.getMinutes()), today = Util.today();
  s.habits.forEach(h => {
    if (!h.reminder.enabled || h.reminder.time !== hm || Habits.lifecycle(h) !== 'active') return;
    const id = h.id + today;
    if (fired[id]) return;
    const st = Habits.status(h, today, today);
    if (st.rec || st.kind === 'unscheduled' || st.kind === 'inactive') return;
    fired[id] = 1;
    const opts = { body: 'Scheduled for today.', tag: 'reset-' + h.id, silent: true, icon: 'icons/icon-192.png' };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r => r.showNotification(h.name, opts)).catch(() => new Notification(h.name, opts));
      else new Notification(h.name, opts);
    } catch (e) { /* notifications unavailable */ }
  });
};

{

   RE:SET — 08-ui.js
   UI toolkit: formatting, layers (sheets / dialogs / full-screen views) wired

UI = RS.UI = { act: {}, layers: [], tab: 'today' };

const cfg = () => RS.Store.state.settings;
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = s => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---- formatting ------------------------------------------------------------ */
UI.fmtDate = (key, style) => {
  const d = Util.parse(key), f = cfg().dateFormat, mon = Util.MONTHS[d.getMonth()], ms = mon.slice(0, 3), day = d.getDate(), dow = Util.DAYS[d.getDay()], y = d.getFullYear();
  const short = f === 'DMY' ? day + ' ' + ms : ms + ' ' + day;
  switch (style) {
    case 'long': return f === 'MDY' ? dow + ', ' + mon + ' ' + day : f === 'YMD' ? dow + ', ' + y + ' ' + ms + ' ' + day : dow + ', ' + day + ' ' + mon;
    case 'dow': return dow.slice(0, 3) + ', ' + short;
    case 'full': return f === 'DMY' ? day + ' ' + ms + ' ' + y : f === 'MDY' ? ms + ' ' + day + ', ' + y : y + ' ' + ms + ' ' + day;
    case 'num': return f === 'DMY' ? Util.pad(day) + '/' + Util.pad(d.getMonth() + 1) + '/' + y : f === 'MDY' ? Util.pad(d.getMonth() + 1) + '/' + Util.pad(day) + '/' + y : y + '-' + Util.pad(d.getMonth() + 1) + '-' + Util.pad(day);
    default: return short;
  }
};
UI.fmtClock = (hh, mm) => (cfg().timeFormat === '24h' ? Util.pad(hh) + ':' + Util.pad(mm) : ((hh % 12) || 12) + ':' + Util.pad(mm) + ' ' + (hh < 12 ? 'AM' : 'PM'));

UI.fmtMonth = key => { const d = Util.parse(key); return Util.MONTHS[d.getMonth()] + ' ' + d.getFullYear(); };
UI.pct = r => (r === null || r === undefined ? '—' : Util.pct(r));

/* ---- feedback --------------------------------------------------------------- */

UI.motionOff = () => { const r = cfg().reducedMotion; return r === 'on' || (r === 'system' && typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) || !cfg().animations; };

UI.toast = (msg, opts) => {
  opts = opts || {};

  box.appendChild(el);
  const kill = () => { if (el.parentNode) el.parentNode.removeChild(el); };
  if (opts.action) el.querySelector('button').addEventListener('click', () => { opts.action.fn(); kill(); });

UI.download = (name, text, mime) => {

  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();

/* ---- layers: sheets, dialogs, full-screen views ------------------------------- */
let pendingBacks = 0, queued = [];
const flushQueue = () => { const q = queued; queued = []; q.forEach(fn => fn()); };

function syncInert() {
  const n = UI.layers.length;
  ['#main', '#tabbar', '#pill'].forEach(sel => { const el = $(sel); if (el) { if (n) el.setAttribute('inert', ''); else el.removeAttribute('inert'); } });
  UI.layers.forEach((l, i) => { if (l.el) { if (i < n - 1) l.el.setAttribute('inert', ''); else l.el.removeAttribute('inert'); } });
}

function build(layer) {
  const isView = layer.type === 'view', dlg = layer.type === 'dialog';
  const wrap = document.createElement('div');
  wrap._layer = layer; layer.el = wrap;
  if (isView) {
    wrap.className = 'view-wrap';
    wrap.innerHTML = '<section class="view" role="region" aria-label="' + esc(layer.title || '') + '"><div class="view-scroll scroll"></div></section>';
    layer.bodyEl = $('.view-scroll', wrap);
  } else {
    wrap.className = 'sheet-wrap' + (dlg ? ' is-dialog' : '');
    wrap.innerHTML = '<div class="scrim" data-act="dismiss"></div>' +
      '<div class="sheet' + (dlg ? ' dialog' : '') + (layer.cls ? ' ' + layer.cls : '') + '" role="' + (dlg ? 'alertdialog' : 'dialog') + '" aria-modal="true" aria-label="' + esc(layer.title || '') + '" tabindex="-1">' +
      (dlg ? '' : '<div class="sheet-grab" aria-hidden="true"></div>') +
      (layer.title ? '<div class="sheet-head"><h2 class="sheet-title">' + esc(layer.title) + '</h2>' + (dlg ? '' : '<button type="button" class="icon-btn" data-act="dismiss" aria-label="Close">' + UI.ic('x', 20) + '</button>') + '</div>' : '') +
      '<div class="sheet-body scroll"></div><div class="sheet-foot"></div></div>';
    layer.bodyEl = $('.sheet-body', wrap); layer.footEl = $('.sheet-foot', wrap); layer.sheetEl = $('.sheet', wrap);
  }
  layer.refresh = () => {
    if (!layer.el || !layer.el.parentNode) return;
    const top = layer.bodyEl.scrollTop, ae = document.activeElement, keepId = ae && layer.el.contains(ae) && ae.id ? ae.id : null;
    layer.bodyEl.innerHTML = layer.body(layer);
    if (layer.footEl) { layer.footEl.innerHTML = layer.foot ? layer.foot(layer) : ''; layer.footEl.hidden = !layer.foot; }
    layer.bodyEl.scrollTop = top;
    if (keepId) { const again = document.getElementById(keepId); if (again) again.focus(); }
    if (layer.after) layer.after(layer);
  };
  return wrap;
}

function openLayer(layer) {
  if (pendingBacks) { queued.push(() => openLayer(layer)); return layer; }
  const host = $(layer.type === 'view' ? '#views' : '#sheets');
  layer.prevFocus = document.activeElement;
  UI.layers.push(layer);
  try { history.pushState({ rsl: UI.layers.length }, ''); } catch (e) { /* history unavailable */ }
  host.appendChild(build(layer));
  layer.refresh();
  syncInert();
  requestAnimationFrame(() => layer.el.classList.add('in'));
  const target = layer.el.querySelector('[autofocus]') || layer.sheetEl || layer.el.querySelector('.view');
  if (target) { if (!target.hasAttribute('tabindex') && target.tagName === 'SECTION') target.setAttribute('tabindex', '-1'); setTimeout(() => { try { target.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 30); }
  if (layer.onOpen) layer.onOpen(layer);
  return layer;
}

function destroy(layer) {
  if (layer.dead) return; layer.dead = true;
  const el = layer.el;
  if (el) { el.classList.remove('in'); el.classList.add('out'); setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, UI.motionOff() ? 0 : 220); }
  if (layer.onClose) { try { layer.onClose(layer); } catch (e) { console.error(e); } }
  syncInert();
  if (layer.prevFocus && document.contains(layer.prevFocus) && !layer.prevFocus.closest('[inert]')) { try { layer.prevFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}

/* Close the top n layers. Always goes through browser history so the Back button stays in step. */
UI.closeTop = n => {
  n = Math.min(n || 1, UI.layers.length); if (!n) return;
  const gone = UI.layers.splice(UI.layers.length - n, n);
  gone.reverse().forEach(destroy);
  pendingBacks++;
  try { if (n > 1) history.go(-n); else history.back(); } catch (e) { pendingBacks = 0; }
  setTimeout(() => { if (pendingBacks) { pendingBacks = 0; flushQueue(); } }, 600);
};
UI.closeAll = () => UI.closeTop(UI.layers.length);
window.addEventListener('popstate', () => {
  if (pendingBacks > 0) { pendingBacks--; if (!pendingBacks) flushQueue(); return; }
  const d = (history.state && history.state.rsl) || 0;
  while (UI.layers.length > d) destroy(UI.layers.pop());
  syncInert();
});

UI.sheet = spec => openLayer(Object.assign({ type: 'sheet' }, spec));
UI.view = spec => openLayer(Object.assign({ type: 'view' }, spec));

UI.hbar = (label, v, valueText, sub, color) => '<div class="hbar"><div class="hbar-top"><span class="hbar-label">' + esc(label) + '</span><span class="hbar-val">' + esc(valueText) + '</span></div>' +
  '<div class="hbar-track" role="img" aria-label="' + esc(label + ': ' + valueText) + '"><span class="hbar-fill" style="width:' + (v === null ? 0 : Math.round(v * 100)) + '%' + (color ? ';background:' + color : '') + '"></span></div>' + (sub ? '<div class="hbar-sub">' + esc(sub) + '</div>' : '') + '</div>';

/* Shapes (not just colour) distinguish day states. */
UI.dayGlyph = (kind) => {
  const c = '<circle cx="8" cy="8" r="5.5"';
  switch (kind) {
    case 'complete': return '<svg class="dg" viewBox="0 0 16 16" aria-hidden="true">' + c + ' class="dg-fill"/></svg>';
    case 'partial': return '<svg class="dg" viewBox="0 0 16 16" aria-hidden="true">' + c + ' class="dg-ring"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" class="dg-fill"/></svg>';
    case 'missed': return '<svg class="dg" viewBox="0 0 16 16" aria-hidden="true">' + c + ' class="dg-ring"/></svg>';
    case 'open': case 'unrecorded': return '<svg class="dg" viewBox="0 0 16 16" aria-hidden="true">' + c + ' class="dg-ring dg-dash"/></svg>';
    case 'skipped': return '<svg class="dg" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 8h7" class="dg-line"/></svg>';

};

/* ---- form binding & settings binding ---------------------------------------------- */
UI.setDraft = (el, v) => { const l = UI.layerOf(el); if (l && l.draft) { l.draft[el.dataset.bind] = v; if (l.onBind) l.onBind(el.dataset.bind, v, el, l); } };
function valueOf(el) { return el.type === 'checkbox' ? el.checked : el.value; }
function coerce(el, v) {
  const t = el.dataset.type;
  if (t === 'int') return Util.int(v, 0);
  if (t === 'num') { const n = Util.num(v); return n === null ? 0 : n; }
  if (t === 'int-or') { const n = parseInt(v, 10); return Number.isFinite(n) ? n : v; }
  return v;
}
UI.onFormEvent = e => {
  const el = e.target; if (!el || !el.dataset) return;
  if (el.dataset.bind !== undefined) UI.setDraft(el, valueOf(el));
  if (e.type === 'change' && el.dataset.set !== undefined) {
    const k = el.dataset.set, v = coerce(el, valueOf(el));
    RS.Store.update(s => { s.settings[k] = v; });
  }
};
UI.act.setSetting = el => {
  const k = el.dataset.k, v = coerce(el, el.dataset.v);
  RS.Store.update(s => { s.settings[k] = v; });
};

/* keyboard: Esc closes the top layer; Tab stays inside it */
document.addEventListener('keydown', e => {
  const top = UI.topLayer(); if (!top) return;
  if (e.key === 'Escape') { e.preventDefault(); UI.closeTop(); return; }
  if (e.key === 'Tab' && top.el) {
    const f = Array.from(top.el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')).filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !top.el.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

}

    default: return '';
  }
}

function metaBits(h, key, st, v) {
  const rec = st.rec, u = v.unit ? ' ' + v.unit : '', out = [];
  const minOn = cfg().minimumMode;
  if (st.kind === 'skipped') out.push('Skipped');
  else if (h.type === 'check') {
    if (st.kind === 'minimum') out.push('Minimum' + (v.minLabel ? ': ' + v.minLabel : ''));
    else if (!rec && minOn && v.minLabel) out.push('Minimum: ' + v.minLabel);
  } else if (h.type === 'measure') {
    if (rec && typeof rec.value === 'number') out.push(fmtN(rec.value) + ' / ' + fmtN(v.target) + u + (st.kind === 'minimum' ? ' · minimum reached' : ''));
    else out.push('Target ' + fmtN(v.target) + u + (minOn && v.minTarget ? ' · minimum ' + fmtN(v.minTarget) : ''));
  } else {
    if (rec && typeof rec.value === 'number') out.push(fmtN(rec.value) + ' of max ' + fmtN(v.target) + u + (st.kind === 'over' ? ' · over limit' : ''));
    else if (rec) out.push('Within limit');
    else out.push('Limit ' + fmtN(v.target) + u + ' · not recorded');
  }
  if (Habits.isFlex(h, key)) { const wp = Habits.weekProgress(h, key); out.push((wp.done + wp.minimum) + ' of ' + wp.goal + ' this week'); }
  return out;
}

UI.habitRow = (h, key, o) => {

/* ---- record sheet ------------------------------------------------------------ */
function recStatusText(h, v, raw) {
  const n = Util.num(raw);
  if (raw === '' || n === null) return '';
  if (n < 0) return 'Amount cannot be negative.';
  const s = Habits.statusForValue(h, v, n), u = v.unit ? ' ' + v.unit : '';
  if (h.type === 'measure') {
    if (s === 'done') return 'Target reached.';
    if (s === 'minimum') return 'Minimum reached. This is recorded as a minimum, not the full target of ' + fmtN(v.target) + u + '.';
    if (s === 'partial') return 'Partial: ' + fmtN(n) + ' of ' + fmtN(v.target) + u + '.';
    return 'Entering 0 clears this day.';
  }

          '</div>';
      } else {
        const quick = [];

          if (minOn && v.minTarget) quick.push('<button type="button" class="chip" data-act="recSetVal" data-n="' + v.minTarget + '">Minimum ' + fmtN(v.minTarget) + '</button>');
          quick.push('<button type="button" class="chip" data-act="recSetVal" data-n="' + v.target + '">Target ' + fmtN(v.target) + '</button>');
        } else {
          quick.push('<button type="button" class="chip" data-act="recWithin">Within limit (not measured)</button>');
        }
        html += UI.field(h.type === 'measure' ? 'Amount done' : 'Amount actually used', '<div class="input-unit"><input id="rec-val" class="input" inputmode="decimal" autocomplete="off" data-bind="value" value="' + esc(d.value) + '" placeholder="0"><span class="unit">' + esc(v.unit || '') + '</span></div>' +
          '<p class="status-line" id="rec-status" aria-live="polite">' + esc(recStatusText(h, v, d.value)) + '</p>', { for: 'rec-val', err: d.err, hint: h.type === 'limit' ? 'You enter this yourself. RE:SET cannot read your phone’s screen time.' : '' }) +
          '<div class="chips">' + quick.join('') + '</div>';
      }
      html += UI.field('Note', '<textarea id="rec-note" class="input" rows="2" maxlength="500" data-bind="note" placeholder="Optional">' + esc(d.note) + '</textarea>', { for: 'rec-note', opt: true });
      if (h.type === 'check' || h.type === 'measure') html += '<button type="button" class="btn quiet wide" data-act="recSkip">' + UI.ic('minus', 16) + 'Skip this day</button><p class="hint center">Skipped days are left out of your rates, not counted as missed.</p>';

UI.act.recLevel = el => { const c = recCtx(el); Habits.logCheck(c.h.id, c.key, el.dataset.v, c.l.draft.note); UI.haptic(12); UI.blip(); UI.closeTop(); };
UI.act.recSkip = el => { const c = recCtx(el); Habits.skip(c.h.id, c.key, c.l.draft.note); UI.closeTop(); };

const STARTERS = [

function greeting() {

  const g = hr >= 5 && hr < 12 ? 'Good morning' : hr >= 12 && hr < 17 ? 'Good afternoon' : 'Good evening';
  return g + (name ? ', ' + name : '');
}

Screens.today = {
  render() {
    const key = Util.today(), s = cfg();
    const live = RS.Store.state.habits.filter(h => Habits.lifecycle(h) !== 'archived');
    const head = '<header class="screen-head"><div><h1 class="display">' + esc(s.greeting ? greeting() : 'Today') + '</h1><p class="sub">' + esc(UI.fmtDate(key, 'long')) + '</p></div>' +
      '<button type="button" class="icon-btn" data-act="goTab" data-tab="settings" aria-label="Settings">' + UI.ic('settings', 22) + '</button></header>';
    const journalRow = () => {
      if (!s.journalEnabled) return '';
      const n = Journal.on(key).filter(e => e.text.trim()).length;
      return '<button type="button" class="linkrow" data-act="openJournal"><span class="lr-ic">' + UI.ic('journal', 20) + '</span><span class="lr-text"><b>Reflection</b><small>' + (n ? UI.plural(n, 'entry', 'entries') + ' today' : 'No entry today') + '</small></span>' + UI.ic('chevR', 18) + '</button>';
    };
    if (!live.length) {
      return head + UI.empty({
        logo: 56, title: 'Nothing to track yet', text: 'Create your first habit. You can change or remove it at any time.',
        action: '<button type="button" class="btn primary" data-act="newHabit">Create your first habit</button>' +
          '<p class="eyebrow starters-label">Or start from a suggestion</p><div class="chips center">' + STARTERS.map((x, i) => '<button type="button" class="chip" data-act="newFromStarter" data-i="' + i + '">' + esc(x.name) + '</button>').join('') + '</div>'
      }) + journalRow();
    }
    const lists = Habits.listForDay(key), day = Analytics.day(key);
    const planned = day.planned, done = day.completed, remaining = Math.max(0, planned - done), pct = planned ? done / planned : 0;
    const from = lastPct.today === undefined ? pct : lastPct.today; lastPct.today = pct;
    const sched = Habits.sorted(lists.scheduled, key);
    const isOpen = h => { const k = Habits.status(h, key, key).kind; return k === 'pending' || k === 'partial'; };
    const todo = sched.filter(isOpen), recorded = sched.filter(h => !isOpen(h));
    let sub;
    if (!planned) sub = lists.flex.length ? 'Nothing is due today — weekly goals are below.' : 'Nothing is scheduled today.';
    else if (!remaining) sub = 'Everything scheduled for today is recorded.';
    else sub = UI.plural(remaining, 'item') + ' remaining' + (todo.length ? ' · next: ' + todo[0].name : '');
    if (day.minimum) sub += ' · ' + day.minimum + ' at minimum';
    const progress = '<section class="progress-card" aria-label="Daily progress"><div class="pc-ring">' + UI.ring(pct, 72, 6, from) + '<span class="pc-pct" aria-hidden="true">' + (planned ? Math.round(pct * 100) + '%' : '') + '</span></div>' +
      '<div class="pc-text"><p class="eyebrow">Today</p><p class="pc-main">' + (planned ? done + ' of ' + planned + ' completed' : 'No habits due') + '</p><p class="pc-sub">' + esc(sub) + '</p></div></section>';
    const compact = s.homeLayout === 'compact';
    let html = head + progress;
    const list = (hs, extra) => '<ul class="hlist' + (compact ? ' compact' : '') + (extra || '') + '" aria-label="Today\u2019s habits">' + hs.map(h => UI.habitRow(h, key, { compact })).join('') + '</ul>';
    if (todo.length && recorded.length) html += '<h2 class="section-label first">To do \u00b7 ' + todo.length + '</h2>' + list(todo) + '<h2 class="section-label">Recorded \u00b7 ' + recorded.length + '</h2>' + list(recorded);
    else if (sched.length) html += list(sched);
    if (lists.flex.length) html += '<h2 class="section-label">Weekly goals</h2><ul class="hlist' + (compact ? ' compact' : '') + '">' + Habits.sorted(lists.flex, key).map(h => UI.habitRow(h, key, { compact })).join('') + '</ul>';
    if (lists.other.length) html += '<details class="more"><summary>Not scheduled today (' + lists.other.length + ')</summary><ul class="hlist dim' + (compact ? ' compact' : '') + '">' + lists.other.map(h => UI.habitRow(h, key, { compact })).join('') + '</ul></details>';
    if (s.quickActions) html += '<nav class="quick" aria-label="Quick actions"><button type="button" class="chip soft" data-act="newHabit">' + UI.ic('plus', 16) + 'Add habit</button><button type="button" class="chip" data-act="goTab" data-tab="focus">' + UI.ic('focus', 16) + 'Focus timer</button><button type="button" class="chip" data-act="goInsights" data-mode="calendar">' + UI.ic('calendar', 16) + 'Calendar</button><button type="button" class="chip" data-act="goInsights" data-mode="overview">' + UI.ic('insights', 16) + 'Progress</button></nav>';
    html += journalRow();
    return html;
  }
};
