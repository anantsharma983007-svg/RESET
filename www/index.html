function duePreview(d, l) {
  const today = Util.today(), h0 = l.hid ? Habits.get(l.hid) : null, cur = h0 ? Habits.current(h0).schedule : null;
  const every = Util.int(d.every, 2);
  const anchor = cur && cur.mode === 'interval' && cur.every === every ? cur.anchor : today;
  const sched = Habits.normSchedule({ mode: d.schedMode, days: d.days, every, perWeek: Util.int(d.perWeek, 3), anchor });
  if (sched.mode === 'weekly') return 'Weekly goal: do it on any day. A single day is never counted as missed.';
  const v = { schedule: sched };
  if (Habits.isScheduled(v, today)) return 'Due today.';
  for (let i = 1; i <= 14; i++) { const k = Util.addDays(today, i); if (Habits.isScheduled(v, k)) return 'Not due today. Next due ' + UI.fmtDate(k, 'dow') + '.'; }
  return 'Not due today.';
}

UI.act.edSave = el => {
  const l = UI.layerOf(el), d = l.draft, e = {}, name = d.name.trim(), minOn = cfg().minimumMode;
  if (!name) e.name = 'Give the habit a name.';
  else if (sTable().habits.some(x => x.id !== l.hid && Habits.lifecycle(x) !== 'archived' && x.name.trim().toLowerCase() === name.toLowerCase())) e.name = 'You already have a habit called \u201c' + name + '\u201d. Choose a different name.';
  if (d.schedMode === 'days' && !d.days.length) e.days = 'Choose at least one day.';
  const every = Util.int(d.every, NaN);
  if (d.schedMode === 'interval' && !(every >= 2 && every <= 60)) e.every = 'Enter a number from 2 to 60.';
  let target = null, minTarget = null;
  if (d.type === 'measure') {
    target = Util.num(d.target);
    if (!(target > 0)) e.target = 'Enter a target greater than 0.';
    if (minOn && String(d.minTarget).trim() !== '') { minTarget = Util.num(d.minTarget); if (!(minTarget > 0 && target > 0 && minTarget < target)) e.minTarget = 'The minimum must be above 0 and below the target.'; }
  } else if (d.type === 'limit') {

  }
  if (d.remEnabled && !/^([01]\d|2[0-3]):[0-5]\d$/.test(d.remTime)) e.remTime = 'Choose a reminder time.';

  if (l.hid) {

function manageRow(h, o) {

/* ===== 12-insights-ui.js ===== */
{
const esc = UI.esc, $ = UI.$, cfg = UI.cfg, fmtN = Util.fmtNum;

   RE:SET — 12-insights-ui.js

UI.insMode = 'overview'; UI.insPeriod = '30'; UI.calMonth = null; UI.calDetail = null;
const stores = () => RS.Store.state;

function periodRange(today) {
  const first = Analytics.firstDay() || today;

  const n = +UI.insPeriod;
  return { from: Util.addDays(today, -(n - 1)), to: today, label: 'last ' + n + ' days' };
}

function overview() {
  const today = Util.today(), st = stores();
  if (!Analytics.hasData()) return UI.empty({ icon: 'insights', title: 'No records yet', text: 'Insights are calculated from what you record. Complete a habit and charts will appear here.' });
  const pr = periodRange(today), rg = Analytics.range(pr.from, pr.to, today), fc = Analytics.focus(pr.from, pr.to);
  let html = UI.seg({ label: 'Period', act: 'insPeriod', k: 'p', value: UI.insPeriod, options: [{ v: '7', label: '7 days' }, { v: '30', label: '30 days' }, { v: '90', label: '90 days' }, { v: 'all', label: 'All' }] });
  const stat = (n, l, sub) => '<div class="stat"><span class="stat-n">' + esc(n) + '</span><span class="stat-l">' + esc(l) + '</span>' + (sub ? '<span class="stat-s">' + esc(sub) + '</span>' : '') + '</div>';
  html += '<div class="stats">' + stat(UI.pct(rg.rate), 'Completion rate', rg.rateDen ? rg.rateNum + ' of ' + rg.rateDen + ' scheduled' : 'no settled days yet') +
    stat(String(rg.completed), 'Habits completed', rg.minimum ? rg.done + ' full · ' + rg.minimum + ' minimum' : rg.done + ' full') +
    stat(Util.fmtMin(fc.seconds / 60), 'Focus time', UI.plural(fc.sessions, 'session')) + '</div>';
  html += '<p class="legend-line">Rates count scheduled days that are already finished. Unscheduled, skipped, paused and future days are left out.</p>';

  const nDays = UI.insPeriod === 'all' ? 0 : +UI.insPeriod;
  if (nDays) {
    const prev = Analytics.range(Util.addDays(pr.from, -nDays), Util.addDays(pr.from, -1), today);
    if (rg.rateDen >= 7 && prev.rateDen >= 7) {
      const dlt = Math.round((rg.rate - prev.rate) * 100);
      html += '<p class="trend"><b>' + (dlt > 0 ? 'Up ' + dlt + ' points' : dlt < 0 ? 'Down ' + Math.abs(dlt) + ' points' : 'About the same') + '</b> compared with the previous ' + nDays + ' days (' + Util.pct(prev.rate) + ' then).</p>';
    }
  }
  if (rg.rateDen < 7) html += '<p class="note-box">' + UI.ic('info', 16) + '<span>Only ' + UI.plural(rg.rateDen, 'scheduled item') + ' finished in this period so far, so this is an early, rough picture rather than a pattern.</span></p>';

  } else {

  const cats = Analytics.byCategory(pr.from, pr.to, today).filter(c => c.counted > 0);
  if (cats.length > 1) html += '<h2 class="section-label">By category</h2>' + cats.map(c => UI.hbar(c.name, c.rate, UI.pct(c.rate), c.completed + ' of ' + c.counted + ' scheduled')).join('');

  const live = st.habits.filter(h => Habits.lifecycle(h) !== 'archived');
  if (live.length) {
    html += '<h2 class="section-label">By habit</h2><ul class="mlist">' + live.map(h => {
      const r = Analytics.habit(h, pr.from, pr.to, today), sk = Analytics.streak(h, today);
      const bits = [r.counted ? r.completed + ' of ' + r.counted + ' scheduled' : 'No settled days'];
      if (sk && sk.current >= 2) bits.push('streak ' + sk.current);
      if (sk && sk.longest >= 3) bits.push('best ' + sk.longest);
      if (!sk) { const wg = Analytics.weeklyGoal(h, pr.from, pr.to, today); if (wg.weeks) bits.push('goal met ' + wg.met + '/' + wg.weeks + ' weeks'); }
      const dots = '<span class="dots" aria-hidden="true">' + Analytics.habitDays(h, 14, today).map(d => '<i class="dt k-' + d.kind + '"></i>').join('') + '</span>';
      return '<li class="mrow" style="' + UI.habitColors(h) + '"><button type="button" class="mrow-main" data-act="openHabit" data-id="' + h.id + '"><span class="hrow-ic">' + UI.ic(h.icon, 18) + '</span><span class="hrow-text"><span class="hrow-name">' + esc(h.name) + '</span><span class="hrow-meta">' + esc(bits.join(' · ')) + '</span>' + dots + '</span><span class="rate">' + UI.pct(r.rate) + '</span></button></li>';
    }).join('') + '</ul>';
    const meas = live.filter(h => h.type === 'measure').map(h => ({ h, r: Analytics.habit(h, pr.from, pr.to, today) })).filter(x => x.r.recorded > 0);
    if (meas.length) html += '<h2 class="section-label">Progress toward targets</h2>' + meas.map(x => { const v = Habits.current(x.h); return UI.hbar(x.h.name, Util.clamp(x.r.avg / v.target, 0, 1), fmtN(Util.round(x.r.avg, 1)) + ' / ' + fmtN(v.target) + (v.unit ? ' ' + v.unit : ''), 'Average over ' + UI.plural(x.r.recorded, 'recorded day'), Themes.habitColor(x.h.color)); }).join('');
  }
  html += '<h2 class="section-label">Totals</h2><dl class="facts"><div><dt>Habits completed</dt><dd>' + Analytics.totalCompleted() + '</dd></div><div><dt>Focus time recorded</dt><dd>' + esc(Util.fmtMin(Analytics.focus('0000-00-00', '9999-99-99').seconds / 60)) + '</dd></div></dl>';
  if (cfg().progressEnabled) {
    html += '<h2 class="section-label">Personal progress</h2><ul class="mlist">' + Progress.DEFS.map(d => { const got = st.milestones[d.id]; return '<li class="mrow' + (got ? '' : ' dim') + '"><span class="mrow-main static"><span class="hrow-ic">' + UI.ic(got ? 'check' : 'flag', 16) + '</span><span class="hrow-text"><span class="hrow-name">' + esc(d.name) + '</span><span class="hrow-meta">' + esc(got ? 'Reached ' + UI.fmtDate(got, 'full') : d.desc) + '</span></span></span></li>'; }).join('') + '</ul><p class="legend-line">Milestones are never removed or reset. You can turn this off in Settings.</p>';
  }
  return html;
}

/* ---- calendar ------------------------------------------------------------------------ */
const KIND_TEXT = { complete: 'all complete', partial: 'partly complete', missed: 'none completed', open: 'in progress', unrecorded: 'not recorded', skipped: 'skipped', none: 'nothing scheduled', future: 'upcoming' };
function calendar() {
  const today = Util.today(), month = UI.calMonth || Util.monthStart(today), first = Analytics.firstDay();
  const ws = cfg().weekStart, n = Util.daysInMonth(month), lead = (Util.dow(month) - ws + 7) % 7;
  let html = '<div class="cal-head"><button type="button" class="icon-btn" data-act="calNav" data-n="-1" aria-label="Previous month">' + UI.ic('chevL', 20) + '</button><h2 class="cal-title" aria-live="polite">' + esc(UI.fmtMonth(month)) + '</h2><button type="button" class="icon-btn" data-act="calNav" data-n="1" aria-label="Next month">' + UI.ic('chevR', 20) + '</button></div>';
  html += '<div class="cal" role="grid" aria-label="' + esc(UI.fmtMonth(month)) + '"><div class="cal-dow" role="row">' + UI.weekdayOrder().map(d => '<span role="columnheader">' + Habits.SHORT_DAYS[d].slice(0, 2) + '</span>').join('') + '</div><div class="cal-grid">';
  for (let i = 0; i < lead; i++) html += '<span class="cal-pad"></span>';
  let monthDone = 0, monthCount = 0;
  for (let d = 1; d <= n; d++) {
    const key = month.slice(0, 8) + Util.pad(d), day = first && key >= first ? Analytics.day(key, today) : null;
    const kind = day ? Analytics.dayKind(day, today) : (key > today ? 'future' : 'none');
    if (day && day.counted && key <= today) { monthDone += day.completed; monthCount += day.counted; }
    const label = UI.fmtDate(key, 'dow') + ': ' + KIND_TEXT[kind] + (day && day.counted ? ', ' + day.completed + ' of ' + day.counted + ' completed' : '');
    html += '<button type="button" role="gridcell" class="cal-cell k-' + kind + (key === today ? ' today' : '') + (UI.calDetail === key ? ' sel' : '') + '" data-act="openDay" data-key="' + key + '" aria-label="' + esc(label) + '"><span class="cal-n">' + d + '</span>' + UI.dayGlyph(kind) + '</button>';
  }
  html += '</div></div>';
  html += '<ul class="legend" aria-label="Legend">' + [['complete', 'All done'], ['partial', 'Partly done'], ['missed', 'Missed'], ['unrecorded', 'Not recorded yet'], ['none', 'Not scheduled']].map(k => '<li>' + (UI.dayGlyph(k[0]) || '<svg class="dg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="1.2" class="dg-fill"/></svg>') + '<span>' + k[1] + '</span></li>').join('') + '</ul>';
  html += '<p class="legend-line">' + (monthCount ? 'This month: ' + monthDone + ' of ' + monthCount + ' scheduled items completed.' : 'No settled records this month.') + ' Future days are never counted as missed.</p>';
  return html;
}
UI.act.calNav = el => { UI.calMonth = Util.addMonths(UI.calMonth || Util.monthStart(Util.today()), +el.dataset.n); App.render(); };

UI.openDay = key => {
  UI.calDetail = key;
  UI.sheet({
    title: UI.fmtDate(key, 'long'), live: true, dayKey: key, onClose: () => { UI.calDetail = null; App.render(); },
    body: () => {
      const today = Util.today(), lists = Habits.listForDay(key), d = Analytics.day(key, today), kind = Analytics.dayKind(d, today);
      let html = '<p class="sheet-sub">' + esc(key > today ? 'Upcoming day. Nothing can be recorded yet.' : (KIND_TEXT[kind].charAt(0).toUpperCase() + KIND_TEXT[kind].slice(1)) + (d.counted ? ' · ' + d.completed + ' of ' + d.counted + ' completed' : '') + (d.minimum ? ' · ' + d.minimum + ' at minimum' : '')) + '</p>';
      const rows = Habits.sorted(lists.scheduled.concat(lists.flex), key);
      if (rows.length) html += '<ul class="hlist">' + rows.map(h => UI.habitRow(h, key, {})).join('') + '</ul>';
      else html += '<p class="muted">No habits were scheduled on this day.</p>';
      if (lists.other.length && key <= today) html += '<details class="more"><summary>Not scheduled (' + lists.other.length + ')</summary><ul class="hlist dim">' + lists.other.map(h => UI.habitRow(h, key, {})).join('') + '</ul></details>';
      if (key <= today && cfg().journalEnabled) { const n = Journal.on(key).filter(e => e.text.trim()).length; if (n) html += '<p class="legend-line">' + UI.plural(n, 'journal entry', 'journal entries') + ' on this day.</p>'; }
      html += '<p class="legend-line">Days keep the schedule and targets they had when recorded.</p>';
      return html;
    }
  });
};
UI.act.openDay = el => UI.openDay(el.dataset.key);
UI.act.insPeriod = el => { UI.insPeriod = el.dataset.v; App.render(); };
UI.act.insMode = el => { UI.insMode = el.dataset.v; App.render(); };

Screens.insights = {
  render() {
    return '<header class="screen-head"><div><h1 class="display">Insights</h1></div></header>' +
      UI.seg({ label: 'View', act: 'insMode', k: 'm', value: UI.insMode, options: [{ v: 'overview', label: 'Overview' }, { v: 'calendar', label: 'Calendar' }] }) +

  }
};

}

/* ---- Journal list ---------------------------------------------------------------------- */

/* ---- Digital Wellbeing ------------------------------------------------------------------ */
function activityCard(h) {
  const today = Util.today(), w = Wellbeing.week(h, today), sum = Wellbeing.weekSummary(h, today), v = Habits.current(h), u = v.unit ? ' ' + v.unit : '';
  const todayRec = Habits.rec(h, today);
  const max = Math.max(v.target, 1, ...w.map(d => d.value || 0));
  const bars = w.map(d => ({ v: d.value === null ? (d.within ? 0 : null) : Math.min(1, d.value / max), axis: Habits.SHORT_DAYS[Util.dow(d.key)].slice(0, 2),
    tip: UI.fmtDate(d.key, 'dow') + ': ' + (d.value !== null ? fmtN(d.value) + u + (d.value > d.limit ? ' (over limit)' : ' (within limit)') : d.within ? 'within limit (not measured)' : d.active ? 'not recorded' : 'not tracked') }));
  const todayText = todayRec ? (typeof todayRec.value === 'number' ? fmtN(todayRec.value) + u + ' used' : 'Within limit') : 'Not recorded today';
  return '<section class="wb-card" style="' + UI.habitColors(h) + '"><div class="wb-top"><div><h3 class="wb-name">' + esc(h.name) + '</h3><p class="hrow-meta">Limit ' + esc(fmtN(v.target) + u) + ' per day · ' + esc(todayText) + '</p></div>' +

    '<div class="limit-chart" style="--lim:' + Util.round(v.target / max, 3) + '">' + UI.bars({ id: 'wb' + h.id, label: h.name + ' over the last 7 days', data: bars, readout: 'Dashed line = your limit. Tap a bar.' }) + '</div>' +
    '<p class="legend-line">' + (sum.recordedDays ? 'Within limit on ' + sum.withinDays + ' of ' + sum.recordedDays + ' recorded days' + (sum.avg !== null ? ' · average ' + fmtN(Util.round(sum.avg, 1)) + u : '') : 'No records in the last 7 days.') + '</p>' +
    '<button type="button" class="btn ghost small" data-act="openRecord" data-id="' + h.id + '" data-key="' + today + '">' + (todayRec ? 'Edit today' : 'Record today') + '</button></section>';
}

const readFileText = f => (f.text ? f.text() : new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error); r.readAsText(f); }));
UI.act.importData = () => UI.pickFile('.json,application/json').then(file => {
  if (!file) return;
  readFileText(file).then(text => {
    const res = Store.parseImport(text);
    if (!res.ok) { UI.alert('Nothing was imported', esc(res.error) + '<br><br>Your existing data has not been changed.'); return; }
    const sm = res.summary, cur = stg(), curRec = Object.keys(cur.records).reduce((n, k) => n + Object.keys(cur.records[k]).length, 0);
    UI.confirm({
      title: 'Replace your data?', confirmLabel: 'Replace my data', danger: true,
      html: '<b>This will overwrite everything currently in the app.</b><br><br>Now in the app: ' + UI.plural(cur.habits.length, 'habit') + ', ' + UI.plural(curRec, 'daily record') + '.<br>In the file' + (res.exportedAt ? ' (exported ' + esc(new Date(res.exportedAt).toLocaleDateString()) + ')' : '') + ': <b>' + UI.plural(sm.habits, 'habit') + '</b>, ' + UI.plural(sm.records, 'daily record') + ', ' + UI.plural(sm.sessions, 'focus session') + ', ' + UI.plural(sm.journal, 'journal entry', 'journal entries') + '.' + (res.issues.length ? '<br><br>Skipped while reading: ' + res.issues.map(esc).join(' ') : '') + '<br><br>You can undo right after restoring.'
    }).then(ok => {
      if (!ok) return;
      const before = Util.clone(Store.state);
      try { localStorage.setItem(Store.KEY + '.before-import', JSON.stringify(before)); } catch (e) { /* storage full: undo still works this session */ }
      Store.replaceAll(res.state);
      UI.toast('Data restored.', { ms: 9000, action: { label: 'Undo', fn: () => { Store.replaceAll(Store.sanitize(before).state); UI.toast('Restore undone.'); } } });
    });
  }).catch(() => UI.alert('Nothing was imported', 'The file could not be read. Your existing data has not been changed.'));
});

/* ===== 15-app.js ===== */
{
const esc = UI.esc, $ = UI.$, cfg = UI.cfg, fmtN = Util.fmtNum;
/* ==========================================================================
   RE:SET — 15-app.js
   Shell: tab bar, rendering, event wiring, splash, boot.
   ========================================================================== */

App = RS.App = {};
const TABS = [['today', 'Today'], ['habits', 'Habits'], ['focus', 'Focus'], ['insights', 'Insights'], ['settings', 'Settings']];
let scrollMemo = {};

App.go = tab => {
  if (!Screens[tab]) return;
  const main = $('#main');
  scrollMemo[UI.tab] = main.scrollTop;
  UI.tab = tab;
  App.render(true);
  main.scrollTop = 0;
  main.focus({ preventScroll: true });
};

App.renderTabbar = () => {
  $('#tabbar').innerHTML = TABS.map(t => '<button type="button" class="tab' + (UI.tab === t[0] ? ' on' : '') + '" data-act="goTab" data-tab="' + t[0] + '"' + (UI.tab === t[0] ? ' aria-current="page"' : '') + '>' + UI.ic(t[0] === 'today' ? 'today' : t[0], 22) + '<span>' + t[1] + '</span></button>').join('');
};
App.renderPill = () => {
  const f = Focus.cur(), pill = $('#pill');
  if (!f || UI.tab === 'focus') { pill.hidden = true; return; }
  pill.hidden = false;
  pill.innerHTML = UI.ic('focus', 16) + '<span id="pill-time">' + (f.status === 'finished' ? 'Done' : Util.clock(Math.ceil(Focus.remaining(f) / 1000))) + '</span><span class="pill-state">' + (f.status === 'running' ? 'Focusing' : f.status === 'paused' ? 'Paused' : 'Review session') + '</span>';
};
App.renderBanner = () => {
  const b = $('#banner'), s = Store.status;
  const msg = s.error || s.notice;
  if (!msg) { b.hidden = true; return; }
  b.hidden = false;
  b.className = 'banner' + (s.error ? ' bad' : '');
  b.innerHTML = '<span>' + esc(msg) + '</span>' + (s.error ? '<button type="button" class="btn ghost small" data-act="bannerData">Export</button>' : '<button type="button" class="icon-btn" data-act="bannerClose" aria-label="Dismiss">' + UI.ic('x', 16) + '</button>');
};
UI.act.bannerClose = () => { Store.status.notice = null; App.renderBanner(); };
UI.act.bannerData = () => UI.act.exportData();

App.render = force => {
  const main = $('#main'), ae = document.activeElement;
  if (!force && ae && main.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  const top = main.scrollTop, same = main.dataset.tab === UI.tab;
  let html;
  try { html = Screens[UI.tab].render(); } catch (err) { console.error(err); html = '<div class="empty"><h2 class="empty-title">This screen could not be shown</h2><p class="empty-text">Your data is safe. Try another tab, or export a backup from Settings \u2192 Backup & restore.</p></div>'; }
  main.innerHTML = html;
  main.dataset.tab = UI.tab;
  main.scrollTop = same ? top : (scrollMemo[UI.tab] || 0);
  App.renderTabbar(); App.renderPill(); App.renderBanner();
  UI.settleRings(main);
};

App.applyPrefs = () => {
  const root = document.documentElement;
  root.dataset.motion = UI.motionOff() ? 'off' : 'on';
  root.dataset.density = cfg().density;
};
App.syncFocus = () => {
  const f = Focus.cur();
  Focus.wake(!!(f && f.status === 'running' && cfg().keepAwake));
  if (!f || f.status !== 'running') { if (Focus.soundKind() !== 'off') Focus.soundStop(); document.title = 'RE:SET'; }
};

App.onChange = () => {
  Themes.apply(); App.applyPrefs(); App.syncFocus();
  const fresh = Progress.evaluate();
  if (fresh.length) UI.toast(fresh.length === 1 ? 'Milestone: ' + fresh[0].name : fresh.length + ' milestones recorded.');
  App.render(); UI.refreshLayers();
};

function splash() {
  const el = $('#splash'); if (!el) return;
  const hide = () => { el.classList.add('hide'); setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 300); };
  if (!cfg().splash) { if (el.parentNode) el.parentNode.removeChild(el); return; }
  el.addEventListener('click', hide);
  setTimeout(hide, UI.motionOff() ? 500 : 1100);
}

App.boot = () => {
  Store.init();
  Journal.pruneEmpty();
  Themes.apply(); App.applyPrefs();
  App.day = Util.today();
  UI.tab = 'today';

  document.addEventListener('click', e => {
    const el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    const layer = UI.layerOf(el);
    if (layer && layer.dead) return; /* ignore taps on a layer that is already closing */
    const fn = UI.act[el.dataset.act];
    if (fn) { try { fn(el, e); } catch (err) { console.error(err); UI.toast('Something went wrong. Your data has not been changed.'); } }
  });
  document.addEventListener('input', UI.onFormEvent);
  document.addEventListener('change', UI.onFormEvent);
  document.addEventListener('submit', e => {
    const f = e.target.closest ? e.target.closest('[data-act-submit]') : null;
    if (f) { e.preventDefault(); const fn = UI.act[f.dataset.actSubmit]; if (fn) fn(f, e); }
  });
  /* keep focused inputs visible above the on-screen keyboard */
  document.addEventListener('focusin', e => {
    const t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && t.closest('.sheet, .view')) setTimeout(() => { try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (x) { /* ignore */ } }, 250);
  });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => {
    document.documentElement.classList.toggle('kb', window.visualViewport.height < window.innerHeight * 0.75);
  });

  Store.subscribe(App.onChange);
  Store.onStatus(App.renderBanner);
  Focus.tick();
  Progress.evaluate();
  App.render(true);
  App.syncFocus();
  splash();

  setInterval(UI.tickFocus, 250);
  setInterval(() => {
    Reminders.check();
    if (Util.today() !== App.day) { App.day = Util.today(); App.render(true); }
  }, 20000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (Focus.tick()) UI.onFocusDone();
      if (Util.today() !== App.day) App.day = Util.today();
      App.render(); App.syncFocus();
    } else Store.flush();
  });
  window.addEventListener('pagehide', () => Store.flush());
  let lastErr = 0;
  window.addEventListener('error', () => { if (RS.now() - lastErr > 5000) { lastErr = RS.now(); UI.toast('Something went wrong. Your data is safe.'); } });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ });
  window.RESET = RS; /* handle for debugging and automated tests */
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', App.boot); else App.boot();

}

})();
</script>
</body>
</html>
